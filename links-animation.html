<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:200px;height:360px;overflow:hidden;background:#1a1a1c;}
.phone{width:200px;height:360px;border-radius:20px;border:3px solid #444;overflow:hidden;position:relative;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.screen{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;background-position:center top;}
.finger{position:absolute;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none;opacity:0;transform:translate(-50%,-50%);}
.ripple{position:absolute;width:28px;height:28px;border-radius:50%;border:2px solid rgba(200,160,74,.9);pointer-events:none;opacity:0;transform:translate(-50%,-50%);}
.ripple-close{border-color:rgba(255,255,255,.7);}
@keyframes fingerTap{0%,10%{opacity:0;transform:translate(-50%,-50%) scale(.5);}20%{opacity:1;transform:translate(-50%,-50%) scale(1);}32%{opacity:1;transform:translate(-50%,-50%) scale(.8);}42%{opacity:1;transform:translate(-50%,-50%) scale(1);}50%,100%{opacity:0;transform:translate(-50%,-50%) scale(1);}}
@keyframes rippleTap{0%,25%{opacity:0;transform:translate(-50%,-50%) scale(1);}35%{opacity:1;transform:translate(-50%,-50%) scale(1);}50%{opacity:0;transform:translate(-50%,-50%) scale(3.5);}100%{opacity:0;transform:translate(-50%,-50%) scale(1);}}
@keyframes showDest{0%,44%{opacity:0;}52%,78%{opacity:1;}88%,100%{opacity:0;}}
@keyframes hideApp{0%,44%{opacity:1;}52%,78%{opacity:0;}88%,100%{opacity:1;}}
@keyframes fingerClose{0%,55%{opacity:0;transform:translate(-50%,-50%) scale(.5);}65%{opacity:1;transform:translate(-50%,-50%) scale(1);}75%{opacity:1;transform:translate(-50%,-50%) scale(.8);}83%{opacity:1;transform:translate(-50%,-50%) scale(1);}90%,100%{opacity:0;transform:translate(-50%,-50%) scale(1);}}
@keyframes rippleClose{0%,68%{opacity:0;transform:translate(-50%,-50%) scale(1);}75%{opacity:1;transform:translate(-50%,-50%) scale(1);}88%{opacity:0;transform:translate(-50%,-50%) scale(3.5);}100%{opacity:0;transform:translate(-50%,-50%) scale(1);}}
.run-app{animation:hideApp 5s ease-in-out infinite;}
.run-dest{animation:showDest 5s ease-in-out infinite;}
.run-tap{animation:fingerTap 5s ease-in-out infinite;}
.run-rtap{animation:rippleTap 5s ease-out infinite;}
.run-close{animation:fingerClose 5s ease-in-out infinite;}
.run-rclose{animation:rippleClose 5s ease-out infinite;}
</style>
</head>
