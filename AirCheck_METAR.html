<style>
:root{
  --paper:#f4ecdc;--paper-hi:#fbf6e8;--paper-edge:#e3d4ad;
  --ink:#1c3d6e;--ink-muted:#5a4a3a;--ink-faint:#8a7a5a;
  --gold:#c8a04a;--gold-lite:#d4b878;
  --cleared:#1f6f3f;--amber:#f59e0b;--stamp-red:#b94a3a;
  --font-ui:'IBM Plex Sans Hebrew',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--paper);font-family:var(--font-ui);color:var(--ink);}
body{display:flex;flex-direction:column;height:100svh;overflow:hidden;}

/* ── HEADER ── */
.header{
  background:var(--ink);padding:10px 16px 8px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;
}
.header-right{display:flex;flex-direction:column;}
.header-title{font-size:18px;font-weight:700;color:#f4ecdc;font-family:var(--font-mono);letter-spacing:.04em;}
.header-sub{font-family:var(--font-ui);font-size:12px;color:rgba(244,236,220,.6);margin-top:3px;}
.back-btn{background:transparent;border:1px solid rgba(244,236,220,.35);border-radius:6px;padding:8px 16px;font-family:var(--font-ui);font-size:13px;font-weight:600;color:rgba(244,236,220,.8);cursor:pointer;white-space:nowrap;}
.back-btn:active{opacity:.8;}

/* ── PILL STRIP ── */
.pill-wrap{background:var(--paper);padding:8px 16px 12px;border-bottom:1px solid var(--paper-edge);}
.metar-pill-strip{display:flex;gap:5px;direction:rtl;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;}
.metar-pill-strip::-webkit-scrollbar{display:none;}
.metar-pill-btn{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1.5px solid var(--paper-edge);background:transparent;color:var(--ink-muted);font-family:var(--font-mono);font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:all .15s;}
.metar-pill-btn:active{opacity:.7;}
.metar-pill-btn.active{border:none;background:var(--ink);color:var(--paper);}
.metar-pill-other{font-family:var(--font-ui);border-style:dashed;color:var(--ink-faint);}
.metar-pill-custom{font-family:var(--font-ui);border-style:dashed;border-color:var(--gold-lite);color:var(--ink-faint);font-size:13px;}
.metar-pill-custom.set{border-style:solid;border-color:var(--gold);color:var(--gold);background:rgba(200,160,74,.08);font-size:13px;}
.metar-pill-custom.active{border-style:solid;border-color:var(--ink);background:var(--ink);color:#f4ecdc;font-size:13px;}
.metar-pill-other.active{background:rgba(200,160,74,.2);border:1.5px solid var(--gold);color:var(--gold-lite);border-style:solid;}
.metar-pill-input-row{display:flex;align-items:center;gap:10px;background:var(--paper-hi);border:1px solid var(--gold-lite);border-radius:4px;padding:7px 12px;margin-top:8px;direction:ltr;}
.metar-pill-input{background:transparent;border:none;border-bottom:1.5px dashed var(--gold);outline:none;font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--ink);flex:1;padding:0 0 1px;text-transform:uppercase;caret-color:var(--gold);letter-spacing:.1em;direction:ltr;-webkit-appearance:none;}
.metar-pill-input::placeholder{color:var(--ink-faint);}

/* ── STATION LABEL ── */
.station-label-bar{
  background:rgba(28,61,110,.06);border-bottom:1px solid var(--paper-edge);
  padding:11px 16px;display:flex;align-items:center;justify-content:space-between;
  direction:rtl;
}
.metar-station-name{font-size:15px;color:var(--ink-muted);font-family:var(--font-ui);}
.metar-age{font-family:var(--font-mono);font-size:9px;color:rgba(100,210,160,.85);letter-spacing:.1em;border:1px solid rgba(100,210,160,.35);border-radius:3px;padding:2px 7px;direction:ltr;flex-shrink:0;}
.metar-age.stale{color:var(--amber);border-color:rgba(245,158,11,.35);}

/* ── TOWER BADGE ── */
@keyframes border-fade{0%,100%{border-color:rgba(245,158,11,.7);}50%{border-color:rgba(245,158,11,.1);}}
@keyframes dot-pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.3;transform:scale(1.5);}}
.tower-bar{display:flex;flex-direction:column;align-items:center;gap:3px;}
.tower-bar-label{font-family:var(--font-ui);font-size:11px;font-weight:600;color:var(--ink-muted);white-space:nowrap;}
.tower-bar-row{display:flex;align-items:center;gap:6px;}
.tower-bell{font-size:14px;line-height:1;}
.tower-btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;padding:5px 9px;cursor:pointer;font-family:var(--font-ui);font-size:12px;border:1.5px solid transparent;white-space:normal;width:168px;min-height:28px;line-height:1.35;text-align:center;}
.tower-btn-none{background:transparent;border-style:dashed!important;border-color:var(--paper-edge)!important;font-weight:400;color:var(--ink-faint);cursor:default;white-space:normal;font-size:11px;}
.tower-btn-fresh{background:rgba(245,158,11,.12);animation:border-fade 1.8s ease-in-out infinite;font-weight:700;color:#7a5000;}
.tower-btn-moderate{background:rgba(245,158,11,.07);border-color:rgba(245,158,11,.3)!important;font-weight:500;color:#b07a20;}
.tower-btn-old{background:transparent;border-color:var(--paper-edge)!important;font-weight:400;color:var(--ink-faint);}
.tower-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.tower-dot-fresh{background:var(--amber);animation:dot-pulse 1.8s ease-in-out infinite;}
.tower-dot-moderate{background:#d4a030;opacity:.6;}
.tower-dot-old{background:var(--ink-faint);opacity:.35;}

/* ── CARDS ── */
.wx-card{background:var(--paper-hi);border:1px solid var(--paper-edge);border-radius:8px;overflow:hidden;margin-bottom:10px;}
.wx-card-hdr{padding:7px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--paper-edge);background:rgba(28,61,110,.04);}

/* ── TOWER POPUP ── */
.tower-popup-overlay{display:none;position:fixed;inset:0;background:rgba(26,19,8,.65);z-index:100;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px);}

.tower-popup-box{background:var(--paper);border-radius:8px;width:100%;max-width:340px;overflow:hidden;direction:rtl;background-image:repeating-linear-gradient(0deg,transparent 0,transparent 27px,rgba(28,61,110,.04) 27px,rgba(28,61,110,.04) 28px);}
.tower-popup-hdr{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--paper-edge);}
.tower-popup-title{font-size:15px;font-weight:700;}

.tower-popup-close{width:100%;padding:12px;background:var(--ink);border:none;font-family:var(--font-ui);font-size:13px;font-weight:700;color:#f4ecdc;cursor:pointer;}

.metar-loading{padding:40px 16px;text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);letter-spacing:.1em;direction:ltr;}

.metar-qnh-banner{background:rgba(31,111,63,.12);border-bottom:1px solid rgba(31,111,63,.25);padding:10px 16px;display:flex;align-items:baseline;gap:12px;direction:ltr;}
.metar-qnh-label{font-family:var(--font-mono);font-size:9px;color:var(--cleared);letter-spacing:.2em;font-weight:700;text-transform:uppercase;}
.metar-qnh-value{font-family:var(--font-mono);font-size:36px;font-weight:700;color:var(--cleared);letter-spacing:.04em;line-height:1;}
.metar-qnh-unit{font-family:var(--font-mono);font-size:11px;color:rgba(31,111,63,.7);letter-spacing:.1em;}
.metar-qnh-hg{font-family:var(--font-mono);font-size:10px;color:rgba(31,111,63,.55);margin-right:auto;letter-spacing:.05em;}
.metar-raw-wrap{padding:10px 14px 8px;}
.metar-raw-label{font-family:var(--font-mono);font-size:8px;color:var(--ink-faint);letter-spacing:.15em;text-transform:uppercase;direction:ltr;margin-bottom:5px;}
.metar-raw{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);direction:ltr;background:var(--paper);border:1px solid var(--paper-edge);border-radius:3px;padding:10px 12px;line-height:1.7;word-break:break-all;letter-spacing:.03em;}
.metar-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--paper-edge);border-bottom:1px solid var(--paper-edge);direction:ltr;}
.metar-field{background:var(--paper-hi);padding:6px 12px;display:flex;flex-direction:column;gap:2px;}
.metar-field-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;direction:ltr;}
.metar-field-value{font-family:var(--font-mono);font-size:16px;font-weight:700;direction:ltr;line-height:1.2;}
.metar-field-zulu{font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);letter-spacing:.05em;direction:ltr;}
.raw-hl-wind{color:#4a7ab5;font-weight:700;}
.raw-hl-vis{color:#6a9a6a;font-weight:700;}
.raw-hl-cloud{color:#8a6a2a;font-weight:700;}

.raw-hl-wx{color:var(--ink-muted);font-weight:700;}
.metar-field.wind .metar-field-label,.metar-field.wind .metar-field-value{color:#4a7ab5;}
.metar-field.vis .metar-field-label,.metar-field.vis .metar-field-value{color:#6a9a6a;}
.metar-field.cloud .metar-field-label,.metar-field.cloud .metar-field-value{color:#8a6a2a;}
.metar-field.temp .metar-field-label,.metar-field.temp .metar-field-value{color:#9a5a3a;}
.metar-field.wx .metar-field-label,.metar-field.wx .metar-field-value{color:var(--ink-muted);}
.metar-field-value.good{color:var(--cleared)!important;}
.metar-field-value.warn{color:var(--amber)!important;}

/* ── FOOTER ── */
.metar-footer{
  padding:10px 14px 14px;display:flex;align-items:center;gap:10px;
  border-top:1px dashed var(--gold-lite);direction:ltr;justify-content:flex-start;

.metar-refresh-btn{background:transparent;border:1px solid var(--gold-lite);border-radius:4px;padding:8px 16px;font-family:var(--font-ui);font-size:14px;font-weight:600;color:var(--ink-muted);cursor:pointer;}
.metar-refresh-btn:active{background:rgba(200,160,74,.1);}
.metar-age-footer{font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);letter-spacing:.06em;direction:ltr;}

/* ── PAGE FOOTER ── */
.page-footer{text-align:center;padding:10px;font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);letter-spacing:.1em;text-transform:uppercase;border-top:1px solid var(--paper-edge);flex-shrink:0;}
</style>

<script>
const METAR_STATION_KEY='aircheck_metar_station';
const METAR_CUSTOM_KEY='aircheck_metar_custom';
let _metarCache={metar:null,taf:null,fetchedAt:null,icao:null};
const TOWER_STATIONS=['LLHZ'];
const STATION_NAMES={
  LLBG:'נתב״ג · Ben Gurion',LLHA:'חיפה · Haifa',
  LLIB:'ראש פינה · Rosh Pina',LLER:'רמון · Ramon',LLHZ:'הרצליה · Herzliya'
};
let _towerData=null;

function getMetarIcao(){
  const sel=localStorage.getItem(METAR_STATION_KEY)||'LLBG';
  if(sel.startsWith('custom')){
    const n=parseInt(sel.replace('custom',''))||1;
    const slots=getCustomSlots();
    return(slots[n-1]||'LLBG').toUpperCase();
  }
  return sel;
}

function syncMetarPills(){
  const sel=localStorage.getItem(METAR_STATION_KEY)||'LLBG';
  const customIcao=localStorage.getItem(METAR_CUSTOM_KEY)||'';
  ['LLBG','LLHA','LLIB','LLER','LLHZ'].forEach(s=>{
    const btn=document.getElementById('mpill-'+s);
    if(btn)btn.classList.toggle('active',sel===s);
  });

  const nameEl=document.getElementById('metarStationLabel');
  if(nameEl){
    if(sel==='custom'){
      nameEl.textContent=customIcao||'הזן קוד ICAO';
    } else {
      nameEl.textContent=STATION_NAMES[sel]||sel;
    }
  }
  renderTowerBadge();
}

function metarPillSelect(icao){
  localStorage.setItem(METAR_STATION_KEY,icao);
  syncMetarPills();
  _metarCache={metar:null,taf:null,fetchedAt:null,icao:null};
  fetchMetar(false);
}

function metarPillOther(){
  localStorage.setItem(METAR_STATION_KEY,'custom');
  syncMetarPills();
  setTimeout(()=>{
    const inp=document.getElementById('metarPillInput');
    if(inp){
      const last=localStorage.getItem(METAR_CUSTOM_KEY)||'';
      inp.value=last;inp.select();inp.focus();
      if(last.length===4){
        _metarCache={metar:null,taf:null,fetchedAt:null,icao:null};
        syncMetarPills();fetchMetar(false);
      }
    }
  },50);
}

function onMetarPillInput(val){
  if(val.length===4){
    localStorage.setItem(METAR_CUSTOM_KEY,val);
    syncMetarPills();
    _metarCache={metar:null,taf:null,fetchedAt:null,icao:null};
    fetchMetar(false);
  }
}

// ── TOWER ──
function towerAgeClass(ts){
  if(!ts)return'none';
  const diffH=(Date.now()-ts)/3600000;
  if(diffH<3)return'fresh';
  if(diffH<9)return'moderate';
  return'old';
}

function renderTowerBadge(){
  const bar=document.getElementById('towerBar');
  if(!bar)return;
  bar.style.display='';
  const btn=document.getElementById('towerBtn');
  const bell=document.getElementById('towerBarBell');
  const isLLHZ=getMetarIcao()==='LLHZ';
  const data=isLLHZ?_towerData:null;
  const cls=(isLLHZ&&data)?towerAgeClass(data.timestamp):'none';
  btn.className='tower-btn tower-btn-'+cls;
  btn.innerHTML='';
  if(!isLLHZ){
    btn.textContent='לא התקבלו עדכוני מגדל לשדה זה';
    btn.style.cursor='default';
    btn.onclick=null;
    if(bell)bell.style.display='none';
  } else if(cls==='none'||!data){
    btn.textContent='לא התקבל עדכון שדה';
    btn.style.cursor='default';
    btn.onclick=null;
    if(bell)bell.style.display='none';
  } else {
    const dot=document.createElement('div');
    dot.className='tower-dot tower-dot-'+cls;
    btn.appendChild(dot);
    const diffMin=Math.round((Date.now()-data.timestamp)/60000);
    const ageStr=diffMin<60?'לפני '+diffMin+' דק׳':'לפני '+Math.round(diffMin/60)+' שע׳';
    const d=new Date(data.timestamp);
    const timeStr=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    btn.appendChild(document.createTextNode(ageStr+'\u00A0\u00A0('+timeStr+')'));
    btn.style.cursor='pointer';
    btn.onclick=openTowerPopup;
    if(bell)bell.style.display=cls==='fresh'?'':'none';
  }
}

function prefetchTower(){
  if(window._towerReady&&window._towerRead){
    window._towerRead('LLHZ').then(d=>{
      _towerData=d;
      renderTowerBadge();
    });
  } else {
    // Firebase module (deferred) hasn't finished loading yet — wait for it
    document.addEventListener('towerReady',()=>{
      window._towerRead('LLHZ').then(d=>{
        _towerData=d;
        renderTowerBadge();
      });
    },{once:true});
  }
}

function openTowerPopup(){
  if(!_towerData)return;
  const diffMin=Math.round((Date.now()-_towerData.timestamp)/60000);
  const diffH=diffMin/60;
  const d=new Date(_towerData.timestamp);
  const timeStr=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
  const ageStr=diffMin<60?'לפני '+diffMin+' דק׳':'לפני '+Math.round(diffH)+' שע׳';
  const stale=document.getElementById('towerPopupStale');
  const txt=document.getElementById('towerPopupText');
  const meta=document.getElementById('towerPopupMeta');
  const hdr=document.getElementById('towerPopupHdr');
  const box=document.getElementById('towerPopupBox');
  if(diffH>=9){
    stale.style.display='';
    box.style.borderColor='var(--paper-edge)';
    hdr.style.background='rgba(0,0,0,.04)';
    hdr.style.borderBottomColor='var(--paper-edge)';
    txt.style.opacity='.7';
  } else {
    stale.style.display='none';
    box.style.borderColor='rgba(245,158,11,.6)';
    hdr.style.background='rgba(245,158,11,.12)';
    hdr.style.borderBottomColor='rgba(245,158,11,.25)';
    txt.style.opacity='1';
  }
  txt.textContent=_towerData.text||'';
  meta.textContent='LLHZ · '+day+' · '+timeStr+' LT · '+ageStr;
  document.getElementById('towerPopup').classList.add('show');
}

function closeTowerPopup(){
  document.getElementById('towerPopup').classList.remove('show');
}

// ── FETCH ──
async function fetchMetar(force){
  const icao=getMetarIcao();
  if(!force&&_metarCache.icao===icao&&_metarCache.fetchedAt&&(Date.now()-_metarCache.fetchedAt)<600000){renderMetarCards();return;}
  document.getElementById('metarCardsWrap').innerHTML='<div class="metar-loading">FETCHING ...</div>';
  document.getElementById('metarAgeFooter').textContent='—';
  try{
    const res=await fetch('https://aircheck-metar.eligrt.workers.dev/?icao='+icao);
    const data=await res.json();
    _metarCache.icao=icao;_metarCache.fetchedAt=Date.now();
    const isIsraeli=icao.startsWith('LL');
    if(isIsraeli){
      const aidMap={'LLBG':'aid-1','LLHA':'aid-2','LLIB':'aid-3','LLER':'aid-4','LLHZ':'aid-5'};
      const aid=aidMap[icao];
      const metarArr=data.data&&data.data.metars&&data.data.metars[aid];
      const tafArr=data.data&&data.data.tafors&&data.data.tafors[aid];
      if(metarArr&&metarArr.length){
        const raw=metarArr[0].content.replace(/=$/,'').trim();
        const obsTime=metarArr[0].valid_from.replace(' ','T')+':00Z';
        _metarCache.metar=parseMetarRaw(raw,obsTime,icao);
      } else if(icao==='LLHZ'){
        const llbgArr=data.data&&data.data.metars&&data.data.metars['aid-1'];
        if(llbgArr&&llbgArr.length){
          const raw=llbgArr[0].content.replace(/=$/,'').trim();
          const obsTime=llbgArr[0].valid_from.replace(' ','T')+':00Z';
          const ref=parseMetarRaw(raw,obsTime,'LLBG');
          ref.noMetar=true;_metarCache.metar=ref;
        } else {_metarCache.metar=null;}
      } else {_metarCache.metar=null;}
      if(tafArr&&tafArr.length){
        const tafLines=tafArr[0].lines.map(l=>l.content.replace(/=$/,'')).join('\n');
        _metarCache.taf={rawTAF:tafLines,icao:icao,issueTime:tafArr[0].issue_date};
      } else {_metarCache.taf=null;}
    } else {
      const metarArr=data.metar;const tafArr=data.taf;
      if(metarArr&&metarArr.length){
        const m=metarArr[0];
        const parsed=parseMetarRaw(m.rawOb||'',m.reportTime||null,icao);
        if(m.temp!==undefined)parsed.temp=m.temp;
        if(m.dewp!==undefined)parsed.dewp=m.dewp;
        if(m.wdir!==undefined)parsed.wdir=m.wdir;
        if(m.wspd!==undefined)parsed.wspd=m.wspd;
        if(m.visib!==undefined)parsed.visib=parseFloat(m.visib)>=6?9999:parseFloat(m.visib)*1000;
        if(m.altim!==undefined){parsed.qnh=Math.round(m.altim);parsed.altimHg=m.altim/33.8639;}
        if(m.clouds)parsed.clouds=m.clouds.map(c=>({cover:c.cover,base:c.base}));
        if(m.name)parsed.name=m.name;
        _metarCache.metar=parsed;
      } else {_metarCache.metar=null;}
      if(tafArr&&tafArr.length){
        _metarCache.taf={rawTAF:tafArr[0].rawTAF||'',icao:icao,issueTime:tafArr[0].issueTime};
      } else {_metarCache.taf=null;}
    }
    // Tower data is prefetched once at load; just re-render for current station
    renderTowerBadge();
    renderMetarCards();
    syncMetarPills();
    // Track usage in the same localStorage keys the main app reads for
    // Firebase stats — main app's syncToFirebase() will pick these up on
    // its next run (app load, new flight, etc).
    try{
      localStorage.setItem('aircheck_metar_used','1');
      localStorage.setItem('aircheck_metar_station',icao);
      const counts=JSON.parse(localStorage.getItem('aircheck_metar_station_counts')||'{}');
      counts[icao]=(counts[icao]||0)+1;
      localStorage.setItem('aircheck_metar_station_counts',JSON.stringify(counts));
    }catch(ex){}
  } catch(e){
    console.error('fetchMetar error:',e);
    document.getElementById('metarCardsWrap').innerHTML='<div class="metar-error">שגיאה בטעינת נתונים<br>בדוק חיבור לאינטרנט</div>';
  }
}

function parseMetarRaw(raw,obsTimeStr,icao){
  const m={rawOb:raw,obsTime:obsTimeStr,name:icao};
  const wind=raw.match(/(\d{3}|VRB)(\d{2,3})(G\d{2,3})?KT/);
  if(wind){m.wdir=wind[1]==='VRB'?'VRB':parseInt(wind[1]);m.wspd=parseInt(wind[2]);}
  const vis=raw.match(/(\d{4})(?!\s*FT)/);
  if(vis)m.visib=parseInt(vis[1]);
  if(raw.includes('CAVOK'))m.visib=9999;
  const temp=raw.match(/(M?\d{2})\/(M?\d{2})/);
  if(temp){m.temp=parseInt(temp[1].replace('M','-'));m.dewp=parseInt(temp[2].replace('M','-'));}
  const qnh=raw.match(/Q(\d{4})/);
  if(qnh){m.altimHg=parseInt(qnh[1])/33.8639;m.qnh=parseInt(qnh[1]);}
  const clouds=[];const cloudRe=/(FEW|SCT|BKN|OVC)(\d{3})/g;let cm;
  while((cm=cloudRe.exec(raw))!==null){clouds.push({cover:cm[1],base:parseInt(cm[2])*100});}
  if(clouds.length)m.clouds=clouds;
  const wxMatch=raw.match(/(CAVOK|NOSIG|TS\S*|\+?RA|\+?SN|FG|HZ|BR|DZ|GR|SQ)/);
  if(wxMatch)m.wxString=wxMatch[1];
  return m;
}

function metarAgeStr(obsTimeStr){
  if(!obsTimeStr)return'—';
  try{
    const obs=new Date(obsTimeStr);
    const diffMin=Math.round((Date.now()-obs.getTime())/60000);
    if(diffMin<1)return'UPD: JUST NOW';
    if(diffMin<60)return'UPD: '+diffMin+' MIN AGO';
    return'UPD: '+Math.round(diffMin/60)+'H AGO';
  }catch(e){return'—';}
}

function zuluToLocal(zuluStr){
  try{
    const d=new Date(zuluStr);
    return{local:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),
           zulu:String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')+'Z'};
  }catch(e){return{local:'—',zulu:'—'};}
}

function colorRaw(raw){
  return raw
    .replace(/(\d{5}KT|\d{3}\d{2}(G\d{2})?KT|VRB\d{2}KT)/g,'<span class="raw-hl-wind">$&</span>')
    .replace(/(9999|[0-9]{4})(?!Z)/g,'<span class="raw-hl-vis">$&</span>')
    .replace(/(FEW|SCT|BKN|OVC|SKC|NCD|CAVOK)\d*/g,'<span class="raw-hl-cloud">$&</span>')
    .replace(/(\d{1,2})\/(\d{1,2})/g,'<span class="raw-hl-temp">$&</span>')
    .replace(/(NOSIG|TS\S*|\+?RA|\+?SN|FG|HZ|BR)/g,'<span class="raw-hl-wx">$&</span>');
}

function renderMetarCards(){
  const icao=_metarCache.icao||getMetarIcao();
  const wrap=document.getElementById('metarCardsWrap');
  const ageFooter=document.getElementById('metarAgeFooter');
  let html='';

  // METAR card
  const m=_metarCache.metar;
  if(m){
    const noMetarNote=m.noMetar?`<div style="background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:4px;padding:7px 10px;margin-bottom:8px;font-size:11px;color:var(--amber);direction:rtl;font-family:var(--font-ui);">אין תחנת מדידה בהרצליה · QNH לפי LLBG</div>`:'';
    const ageStr=metarAgeStr(m.obsTime);
    ageFooter.textContent=ageStr;
    const raw=m.rawOb||'';
    const qnh=m.qnh?String(m.qnh):(()=>{const q=raw.match(/Q(\d{4})/);return q?q[1]:'—';})();
    const qnhHg=m.altimHg?m.altimHg.toFixed(2):'—';
    const times=zuluToLocal(m.obsTime);
    const windStr=(m.wdir!==undefined?m.wdir+'°':'—')+'/'+(m.wspd!==undefined?m.wspd+'kt':'—');
    const vis=m.visib!==undefined?(m.visib>=9999?'9999m':m.visib+'m'):'—';
    const visGood=m.visib===undefined||m.visib>=5000;
    const clouds=(m.clouds&&m.clouds.length)?m.clouds.map(c=>(c.cover||'')+(c.base!==undefined?String(c.base/100).padStart(3,'0'):'')).join(' '):(raw.includes('CAVOK')?'CAVOK':'—');
    const cloudsGood=clouds==='CAVOK'||!m.clouds||m.clouds.every(c=>!c.cover||c.cover==='FEW'||c.cover==='SKC');
    const temp=(m.temp!==undefined?m.temp+'°':'—')+'/'+(m.dewp!==undefined?m.dewp+'°':'—');
    const wx=m.wxString||raw.match(/(CAVOK|NOSIG|TS\S*|RA|SN|FG|HZ|BR)/)?.[0]||'—';
    const wxGood=!wx||wx==='NOSIG'||wx==='CAVOK';
    html+=`${noMetarNote}
    <div class="wx-card">
      <div class="wx-card-hdr"><div class="wx-card-lbl">METAR</div><div class="wx-card-time">${times.zulu} · ${times.local} LT</div></div>
      <div class="metar-qnh-banner"><div class="metar-qnh-label">QNH</div><div class="metar-qnh-value">${qnh}</div><div class="metar-qnh-unit">hPa</div><div class="metar-qnh-hg">${qnhHg} inHg</div></div>
      <div class="metar-fields">
        <div class="metar-field wind"><div class="metar-field-label">WIND</div><div class="metar-field-value">${windStr}</div></div>
        <div class="metar-field vis"><div class="metar-field-label">VIS</div><div class="metar-field-value ${visGood?'good':''}">${vis}</div></div>
        <div class="metar-field cloud"><div class="metar-field-label">CLOUDS</div><div class="metar-field-value ${cloudsGood?'good':''}">${clouds}</div></div>
        <div class="metar-field temp"><div class="metar-field-label">TEMP/DP</div><div class="metar-field-value">${temp}</div></div>
        <div class="metar-field wx"><div class="metar-field-label">WX</div><div class="metar-field-value ${wxGood?'good':''}">${wx}</div></div>
        <div class="metar-field"><div class="metar-field-label" style="color:var(--ink-faint)">TIME</div><div class="metar-field-value">${times.local}</div><div class="metar-field-zulu">(${times.zulu})</div></div>
      </div>
      <div class="metar-raw-wrap"><div class="metar-raw-label">RAW METAR${m.noMetar?' · ref: LLBG':''}</div><div class="metar-raw">${colorRaw(raw)}</div></div>
    </div>`;
  } else {
    html+='<div class="metar-error">אין METAR זמין עבור '+icao+'</div>';
  }

  // TAF card
  const t=_metarCache.taf;
  if(t){
    const rawTaf=t.rawTAF||'';
    const formatted=rawTaf.split(/(?=TEMPO|BECMG|FM|PROB)/g).map(l=>l.trim()).filter(Boolean).join('\n');
    const ageStr=metarAgeStr(t.issueTime);
    html+=`<div class="wx-card">
      <div class="wx-card-hdr"><div class="wx-card-lbl">TAF</div><div class="wx-card-time">${ageStr}</div></div>
      <div class="taf-body"><div class="taf-raw">${formatted}</div></div>
    </div>`;
  } else {
    html+='<div class="metar-error" style="margin-top:8px;">אין TAF זמין עבור '+icao+'</div>';
  }

  wrap.innerHTML=html;
}

// ── CUSTOM PILLS ──
const CUSTOM_KEY='aircheck_metar_custom_slots';
function getCustomSlots(){try{return JSON.parse(localStorage.getItem(CUSTOM_KEY)||'["","",""]');}catch(e){return['','',''];}}
function saveCustomSlots(s){localStorage.setItem(CUSTOM_KEY,JSON.stringify(s));}

function syncCustomPills(){
  const slots=getCustomSlots();
  const sel=localStorage.getItem(METAR_STATION_KEY)||'LLBG';
  const customIdx=sel.startsWith('custom')?parseInt(sel.replace('custom',''))-1:-1;
  slots.forEach((v,i)=>{
    const btn=document.getElementById('mpill-c'+(i+1));
    if(!btn)return;
    btn.classList.remove('set','active');
    if(v){
      btn.textContent=v;
      btn.classList.add('set');
      if(customIdx===i)btn.classList.add('active');
    } else {
      btn.textContent='✎ הוסף';
    }
  });
}

function customPillTap(n){
  const slots=getCustomSlots();
  const v=slots[n-1];
  if(!v){customPillEdit(n);return;}
  localStorage.setItem(METAR_STATION_KEY,'custom'+n);
  syncMetarPills();syncCustomPills();
  _metarCache={metar:null,taf:null,fetchedAt:null,icao:null};
  fetchMetar(false);
}

function customPillEdit(n){
  const slots=getCustomSlots();
  const current=slots[n-1]||'';
  // Use a simple inline prompt via modal-like approach
  const icao=window.prompt('הזן קוד ICAO (4 אותיות):',current);
  if(icao===null)return;
  const val=icao.trim().toUpperCase().slice(0,4);
  if(val.length<2)return;
  slots[n-1]=val;
  saveCustomSlots(slots);
  localStorage.setItem(METAR_STATION_KEY,'custom'+n);
  syncMetarPills();syncCustomPills();
  _metarCache={metar:null,taf:null,fetchedAt:null,icao:null};
  fetchMetar(false);
}

function backToApp(){
  const from=new URLSearchParams(window.location.search).get('from')||'AirCheck_RD.html';
  window.location.href=from+'?resume=1';
}

(function init(){
  const sel=localStorage.getItem(METAR_STATION_KEY)||'LLBG';
  syncMetarPills();syncCustomPills();
  prefetchTower();
  fetchMetar(false);
})();
</script>
