<!DOCTYPE html>
<!-- v1.01.058T_TBL003: Savannah tables. TBL001: "מהירויות הזדקרות IAS" weight×flaps grid. TBL002: "מהירויות ומדפים" V-speeds as 2-col table (name|speed), sorted high→low (VNE,VNO,VA,VFE); duplicate empty header removed. TBL003: מצבי מדפים split from packed row into header + 3 items (not a table — simple list). TBL004: מצבי מדפים block moved from "מהירויות ומדפים" into "מהירויות הזדקרות IAS" (below stall table), rows reordered מלא→חצי→UP to match table order. TBL005: renamed sections — "מהירויות ומדפים"→"מגבלות מהירות", "מהירויות הזדקרות IAS"→"מהירות הזדקרות ומדפים"; IAS cue moved to stall table corner cell (table-head sub="מי״ש IAS"). Corner label = table-head sub field. TBL006: renamed "מגבלות מהירות"→"מגבלות מהירות IAS". TBL007: engine arcs → 2 color-coded tables (pressure bar / temp °C) under header "מגבלות מנוע (קשתות לחץ וטמפ׳)". Zones as rows, instruments as columns. NEW: table-row sub = arc color (red/green/yellow) for row tint; "-" in a cell = intentional empty (no flag). 4 packed arc item-rows removed. TBL008: (A) removed redundant flagged "מנוע ומכשירים" in-content header; (B) arc color now on zone-label cell only, data cells clean (removed muddy tints); (C) oil pressure split into two yellow rows צהוב תחתון (0.8-2.0) above green and צהוב עליון (5.0-7.0) below red, matching Rotax arc order. TBL009: arc data cells get light wash of the zone color (option 3) — strong label + subtle data tint, keeps numbers readable for 60+ cockpit use. TBL010: pinned row-label column width (34%, table-layout:fixed) so both arc tables align; corner unit label (bar/°C) enlarged to 12.5px mono for legibility. TBL011: corner cell text forced white on green band. TBL012: (A) removed duplicate "מגבלות הפעלה" in-content header; (B) 3 G-load items → 2-col table "מגבלות עומס G" (corner=g), moved to bottom of "מגבלות משקל ואיזון". TBL013: fixed-width first column (34%, table-layout:fixed) now scoped to ARC tables only (they need to match each other); regular tables (G-load, V-speeds) auto-size first column and allow long labels to wrap. TBL014: G-load values reordered negative/lower first — UP "-2.0 / +4.0", FULL "0 / +2.0" — so they read correctly LTR (lower on left). TBL015: climb (ביצועי מטוס/טיפוס) 3 packed weight rows → table, altitude=rows weight=columns, corner=רגל/דקה, VY as top row labeled "VY (MPH)". Cleaned inconsistent source formatting. TBL016: אובדן גובה בהזדקרות 6 packed rows → 3×2 grid (config=rows, engine state=columns מנוע בסרק/פועל). TBL017: corner changed ft→תצורה (labels the config rows); ft unit moved onto each value cell (150 ft etc). TBL018: ביצועי המראה + ביצועי נחיתה → 2 matching tables (altitude=rows DA labels, ריצת קרקע/מרחק כולל=columns), corner=מטר, bare numbers. TBL019: takeoff/landing corner changed מטר→"גובה צפיפות (DA)" (labels rows); מטר unit moved onto each value. TBL020: swapped source order to "מטר <num>" so it renders as "<num> מטר" (number left, unit right) under the cell bidi — no direction change, just before/after flip. TBL021: reverted to source "<num> מטר"; num cell is direction:ltr so it TBL021: value cells auto-direction — cells with Hebrew unit (מטר) render RTL (number right, unit left) per preference; pure numeric/range cells stay LTR so ranges like -2.0/+4.0 and 2.0-5.0 keep order. TBL022: removed redundant "מערכת דלק" in-content header (duplicate of auto section title). Types: table-head (columns in val) + table-row (label in item, ;-cells in val). App base v1.01.058T unchanged. v1.01.059T_TBL022: PWA launch update mechanism. On launch the app fetches its own live HTML from GitHub with a cache-buster, reads the fresh footer version via getAppVersion(), and if it differs from the running version does a single guarded location.reload() (sessionStorage one-shot flag prevents loops) so the browser pulls the new file. A loading overlay shows "מוריד עדכונים...", escalates to "חיבור איטי או תקלת רשת..." after a few seconds, and on failure/offline falls back to the cached copy. The רענן footer button now force-triggers the same check. UPDATE_URL points at the live TEST file. TBL023: RPM (סל״ד) 6 packed item rows in מנוע ומכשירים → one sorted table (corner=RPM, label col=סל״ד). 5 plain setpoint rows sorted low→high (סרק 1,400-1,500; שיוט 4,600-5,500; שיוט 75% 5,000; המראה מזערי 5,200; מרבי רציף 5,500), then 2 arc rows: yellow 5,500-5,800, red 5,800. Green zone left implicit (its span = the setpoints); only caution/redline get arc color, matching pressure/temp arc tables. TBL024: reordered מנוע ומכשירים — grouped engine specs + oil/coolant capacities under new "מפרט מנוע" header; RPM table moved below them under new "טווחי סל״ד" header. RPM table headers corrected: corner (row-axis) = "מצב / קשת", value column = "RPM" (was reversed). TBL025: RPM setpoint rows (סרק..מרבי רציף) given light green tint via new "green-soft" arc keyword (light wash both cells, dark text) so the green operating zone reads green instead of plain white. New CSS class arc-green-soft; renderer zoneCls + isArc updated. Strong "green" (pressure/temp tables) unchanged. v1.01.060T_TBL026: Tomer review changes (Savannah only, 6 items): (1) takeoff checklist split — 5 setup items (מדפים,מקזז,משאבת דלק,אורות,חימום קרבורטור) moved from המראה רגילה to לפני המראה; 2 warnings now precede מצערת/סל״ד; header הכנה והרצה→הכנה וביצוע. (2) door: נועלי דלת משניים→נועלי דלת, val +וללא חופש בדלת. (3) taxi flaps val UP לשיפור הראות בהסעה→UP. (4) header בדיקת מנוע→בדיקות מגנטו והכנה לריצת המראה. (5) 4 speed rows (רוטציה/Vx/טיפוס התחלתית/גישה) packed 3-weight strings→600kg only, format X מי״ש (600 ק״ג). (6) 4 V-speed table rows expanded with parenthetical descriptions, V-code kept first. v1.01.061T/062T: header reworked to single row — "AirCheck-POH" title + "טיסה חדשה" button grouped on the right (RTL); clickable aircraft area (name + "החלף מטוס ›" hint + thumbnail) on the left opens the picker (askNF). "טיסה חדשה" now clears ticks only and keeps current aircraft (askNFlegacy→doNF). Version format simplified to v1.01.XXXT (dropped _TAG suffix). v1.01.063T: added "חזרה ל AirCheck+" back button (satellite-page pattern) — reads ?from= URL param and returns there with ?resume=1; button rendered only when from is present, so standalone/direct launches don't show it. Default fallback AirCheck_RD.html matches METAR/passenger-briefing. v1.01.064T: back button now always shown (not just when ?from= present) to promote AirCheck+ — direct-link users still get it and land on AirCheck_RD.html?resume=1 via the existing fallback. v1.01.065T: back button restyled to match satellite pages — squareish (border-radius:6px, was pill 20px), moved to far-left of the banner (out of the right-side title group), 13px, same transparent border as METAR/passenger-briefing .back-btn. v1.01.066T: "החלף מטוס" hint centered beneath the aircraft name (brandtxt text-align center, brandline centered); chevron › removed, replaced with a dotted underline to signal it's clickable. v1.01.067T: header elements evenly distributed — unwrapped the title+newflight group so all 4 (AirCheck-POH title right, new-flight, aircraft, back-to-AirCheck left) are direct flex children under space-between, giving symmetric gaps. v1.01.068T: mobile portrait fix — title+newflight regrouped in .hdrright (row on wide screens keeps the symmetric 4-across; column under max-width:600px so "AirCheck-POH" sits on top and "טיסה חדשה" stacks beneath it, aircraft stays centered, back stays left). Header padding/fonts/thumbnail tightened on narrow screens to stop the title wrapping. v1.01.069T: wide-screen header changed from space-between to space-evenly so all 4 elements (back-left, aircraft, new-flight, title-right) get equal gaps instead of the middle two clustering. Mobile column stack unchanged. v1.01.070T: header spacing corrected — back-to-AirCheck pinned left and AirCheck-POH title pinned right (space-between, like satellite pages); the aircraft selector + new-flight pill now sit in a flex:1 middle group (.hdrmid, space-evenly) so only those two spread symmetrically between the fixed ends. Mobile query updated to the new structure. v1.01.071T: swapped middle-group order so RTL reads title → new-flight → aircraft → back. v1.01.072T: restored mobile stacking — title+newflight regrouped in .hdrtitle which is display:contents on wide (children spread independently, 4-across unchanged) and a flex column on mobile (≤600px) so "טיסה חדשה" sits beneath the AirCheck-POH title; aircraft centered, back left. v1.01.073T: fixed wide-screen symmetry — .hdrmid changed from flex:1 to display:contents so the aircraft is no longer centered inside a stretched middle box; now title, new-flight, aircraft and back are all effective flex children of the appbar under space-between, giving equal gaps. Mobile hdrtitle column override unchanged. -->

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="POH">
<meta name="theme-color" content="#1c3d6e">

<meta property="og:title" content="AirCheck POH">
<meta property="og:description" content="Your checklist, one tap away">
<meta property="og:image" content="https://eligrt.github.io/AirCheck-POH/poh_og.png">

<style>
:root{
  --paper:#f4ecdc;--paper-hi:#fbf6e8;--paper-edge:#e3d4ad;
  --ink:#1c3d6e;--ink-soft:#5a4a3a;--ink-faint:#8a7a5a;
  --gold:#c8a04a;--gold-deep:#a87c2e;--line:#ddd2bc;
  --done:#1f6f3f;--surround:#16171a;
  --mono:'IBM Plex Mono',monospace;

  /* ── 3-tier hue system ── */
  /* strong = top tab + active sub-tab · tint = page paper · rail = idle sub-tab */
  --white-strong:#ffffff;  --white-tint:#f7f1e5;  --white-rail:#efe7d4;  --white-txt:#2b2620;
  --red-strong:#c0201f;    --red-tint:#f7dedd;     --red-rail:#f0cfce;    --red-txt:#5c0f0e;
  --yellow-strong:#f2c200; --yellow-tint:#fdf4cf;  --yellow-rail:#f7ecb0; --yellow-txt:#5c4700;
  --green-strong:#1f8a4c;  --green-tint:#dff1e6;   --green-rail:#c3e4cf;  --green-txt:#134a2c;
}
*{box-sizing:border-box;margin:0;padding:0;}
/* prevent accidental text selection / copy-paste on touch devices */
.screen,.screen *{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
body{background:var(--paper);font-family:'Heebo',sans-serif;color:#e8e0cf;}
.num{font-family:var(--mono);}

.stage{height:100svh;width:100vw;}
.tablet,.phone{width:100%;height:100%;}
.screen{width:100%;height:100%;overflow:hidden;background:var(--paper);position:relative;display:flex;flex-direction:column;}


/* app bar */
.appbar{background:var(--ink);color:#f4ecdc;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:2px solid var(--gold);z-index:20;direction:rtl;gap:10px;}


.hdrtitle{display:contents;}.hdrmid{display:contents;}.apptitle{font-size:18px;font-weight:800;color:#fff;letter-spacing:.03em;font-family:'Heebo';white-space:nowrap;}.acband{background:transparent;border:none;padding:4px 6px;display:flex;align-items:center;gap:8px;direction:rtl;cursor:pointer;flex-shrink:0;border-radius:9px;}.acband:active{background:rgba(255,255,255,.08);}.acthumb{width:38px;height:38px;border-radius:9px;overflow:hidden;flex-shrink:0;border:1.5px solid var(--gold);background:#0f2647;}.acthumb img{width:100%;height:100%;object-fit:cover;display:block;}.brandtxt{display:flex;flex-direction:column;line-height:1.15;text-align:center;}.brandline{display:flex;align-items:center;gap:6px;justify-content:center;}.acnm{font-size:16px;font-weight:800;color:#fff;letter-spacing:.01em;}.acswaphint{font-size:10.5px;font-weight:600;color:rgba(230,200,119,.85);letter-spacing:.02em;margin-top:1px;align-self:center;border-bottom:1px dotted rgba(230,200,119,.7);padding-bottom:1px;}.newflight{font-size:12px;font-weight:700;border:1px solid rgba(200,160,74,.5);border-radius:20px;padding:7px 13px;color:#e6c877;cursor:pointer;background:rgba(200,160,74,.14);white-space:nowrap;font-family:'Heebo';display:flex;align-items:center;gap:5px;direction:rtl;}.nfplus{font-size:14px;line-height:1;}.backbtn{background:transparent;border:1px solid rgba(244,236,220,.35);border-radius:6px;padding:7px 14px;font-family:'Heebo';font-size:13px;font-weight:600;color:rgba(244,236,220,.8);cursor:pointer;white-space:nowrap;direction:rtl;}.backbtn:active{opacity:.8;}
.newflight:active{background:rgba(200,160,74,.28);}

/* top color bar */
.colorbar{display:flex;flex-shrink:0;z-index:15;gap:2px;padding:5px 5px 0;background:var(--ink);}
.colorbar .cb{flex:1;padding:12px 4px;text-align:center;font-size:14px;font-weight:800;cursor:pointer;transition:filter .12s,opacity .12s;position:relative;border-radius:7px 7px 0 0;}
.cb.c-white{background:var(--white-strong);color:var(--ink);}
.cb.c-red{background:var(--red-strong);color:#fff;}
.cb.c-yellow{background:var(--yellow-strong);color:var(--yellow-txt);}
.cb.c-green{background:var(--green-strong);color:#fff;}
.colorbar .cb:not(.act){filter:brightness(.6) saturate(.68);opacity:.82;}
.cb.c-white.act{box-shadow:inset 0 -4px 0 var(--ink);}
.cb.c-red.act{box-shadow:inset 0 -4px 0 #6d0f0e;}
.cb.c-yellow.act{box-shadow:inset 0 -4px 0 var(--yellow-txt);}
.cb.c-green.act{box-shadow:inset 0 -4px 0 #123f24;}

.body{flex:1;display:flex;overflow:hidden;min-height:0;}

/* ── single rail, normal horizontal text ── */
.railwrap{position:relative;flex-shrink:0;width:25%;display:flex;}
.phone .railwrap{width:54px;}
.railwrap .rail{width:100%;}
.rail{flex-shrink:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain;}
.phone .rail{width:100%;}
.rail::-webkit-scrollbar{display:none;width:0;height:0;}
.list{scrollbar-width:none;-ms-overflow-style:none;}
.list::-webkit-scrollbar{display:none;width:0;height:0;}
/* phone tabs: rotated vertical text */
.phone .rtab{padding:14px 0;display:flex;align-items:center;justify-content:center;min-height:92px;text-align:center;}
.phone .rtab .rlabel{writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);line-height:1.25;white-space:normal;font-size:12.5px;font-weight:700;}
.rtab{padding:14px 12px;font-size:12.5px;font-weight:600;line-height:1.3;cursor:pointer;border-bottom:1px solid rgba(0,0,0,.08);-webkit-tap-highlight-color:transparent;transition:background .12s;position:relative;}
.tablet .rtab{padding:17px 13px;font-size:13.5px;}
/* per-section progress fill — a thin track on the tab's inner edge, fills as items are ticked */
.ptrack{position:absolute;background:var(--paper-edge);z-index:0;pointer-events:none;overflow:hidden;}
.pfill{position:absolute;background:var(--done);}
/* tablet: vertical track on inner (pane-side) edge, fills top→bottom */
.tablet .rtab .ptrack{top:0;bottom:0;inset-inline-end:0;width:4px;}
.tablet .rtab .pfill{top:0;inset-inline-end:0;width:100%;}
/* phone: horizontal track on top edge, fills across */
.phone .rtab .ptrack{top:0;bottom:0;left:0;width:4px;}
.phone .rtab .pfill{top:0;left:0;width:100%;}
/* keep the tab label above the track */
.rtab .rlabel,.tablet .rtab>*:not(.ptrack){position:relative;z-index:1;}
/* selected tab: same green, brighter, so it reads against the strong active bg (no new colour to learn) */
.rail .rtab.act .pfill{background:#4ade80;}
.rail.r-red .rtab.act .ptrack,.rail.r-green .rtab.act .ptrack{background:rgba(255,255,255,.28);}
.cb{position:relative;}
.mark{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--ink);}
.cbmark{top:50%;transform:translateY(-50%);inset-inline-start:11px;}
.cb.c-red .cbmark,.cb.c-green .cbmark{background:#fff;}
.cb.c-white .cbmark{background:var(--ink);}
/* idle tab = rail tone of category */
.rail.r-white .rtab{background:var(--white-rail);color:var(--white-txt);}
.rail.r-red .rtab{background:var(--red-rail);color:var(--red-txt);}
.rail.r-yellow .rtab{background:var(--yellow-rail);color:var(--yellow-txt);}
.rail.r-green .rtab{background:var(--green-rail);color:var(--green-txt);}
/* active tab = strong category color, with clear pop (c) */
.rail .rtab.act{position:relative;font-weight:800;border-radius:0 8px 8px 0;box-shadow:0 1px 6px rgba(0,0,0,.16);z-index:1;}
.rail.r-white .rtab.act{background:#fff;color:var(--ink);}
.rail.r-red .rtab.act{background:var(--red-strong);color:#fff;}
.rail.r-yellow .rtab.act{background:var(--yellow-strong);color:var(--yellow-txt);}
.rail.r-green .rtab.act{background:var(--green-strong);color:#fff;}
/* idle tabs flatter so active stands out */
.rail .rtab:not(.act){opacity:.82;}

/* content pane — paper tinted to category */
.pane{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;}
.pane.p-white{background:var(--white-tint);}
.pane.p-red{background:var(--red-tint);}
.pane.p-yellow{background:var(--yellow-tint);}
.pane.p-green{background:var(--green-tint);}

.pane-hd{flex-shrink:0;padding:11px 14px 9px;display:flex;align-items:center;gap:9px;}
.pane-hd .ptitle{font-size:15.5px;font-weight:800;}
.p-white .ptitle{color:var(--ink);}
.p-red .ptitle{color:var(--red-txt);}
.p-yellow .ptitle{color:var(--yellow-txt);}
.p-green .ptitle{color:var(--green-txt);}
.pane-hd .pcount{margin-inline-start:auto;font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px;background:var(--ink);color:#f4ecdc;}
.clear-sec{font-size:10px;letter-spacing:.02em;border:1px solid rgba(0,0,0,.3);border-radius:6px;padding:5px 10px;cursor:pointer;background:rgba(255,255,255,.7);margin-inline-start:8px;font-family:'Heebo';font-weight:700;white-space:nowrap;}
.p-white .clear-sec{color:var(--ink);}
.p-red .clear-sec{color:var(--red-txt);border-color:rgba(92,15,14,.4);}
.p-yellow .clear-sec{color:#5c4700;border-color:rgba(92,71,0,.4);}
.p-green .clear-sec{color:var(--green-txt);border-color:rgba(19,74,44,.4);}

.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;}
/* zoom-proof all tappable controls on iOS (double-tap zoom) */
button,[onclick]{touch-action:manipulation;}

.row{display:flex;align-items:center;gap:11px;padding:15px 14px;border-bottom:1px solid rgba(0,0,0,.045);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.tablet .row{padding:19px 16px;gap:13px;}
.tablet .row .box{width:25px;height:25px;}
.row .box{width:22px;height:22px;border-radius:50%;border:2px solid rgba(0,0,0,.28);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55);transition:all .15s;}
.row .box svg{width:12px;height:12px;stroke:#fff;stroke-width:3.5;fill:none;opacity:0;}
.row.done .box{background:var(--done);border-color:var(--done);}
.row.done .box svg{opacity:1;}
.row .tx{flex:0 1 auto;font-size:13.5px;font-weight:500;line-height:1.3;}
.tablet .row .tx{font-size:15px;}
.leader{flex:1 1 auto;align-self:flex-end;margin-bottom:6px;min-width:16px;border-bottom:2px dotted rgba(0,0,0,.28);}
.list.surf-red .leader{border-bottom-color:rgba(255,255,255,.45);}
.p-white .tx{color:var(--ink);}
.p-red .tx{color:var(--red-txt);}
.p-yellow .tx{color:#3f3100;}
.p-green .tx{color:var(--green-txt);}
.row .val{font-size:13px;font-weight:600;text-align:left;flex-shrink:0;max-width:44%;line-height:1.3;}
.p-white .val{color:#6a5d3f;}
.p-red .val{color:var(--red-txt);}
.p-yellow .val{color:#6b5200;}
.p-green .val{color:var(--green-txt);}
.row .val.num{font-family:var(--mono);direction:ltr;font-weight:500;}
.row.done .tx{text-decoration:line-through;opacity:.45;}
.row.done .val{opacity:.4;}
/* ── current-item highlight (green tint, no edge bar) ── */
.row.cur{background:rgba(31,111,63,.12);}
/* ── run bar (big advance button) ── */
.runbar{flex-shrink:0;padding:8px 12px 10px;background:var(--paper-hi);border-top:1px solid var(--line);}
/* runway = tick state */
.runbtn{position:relative;width:100%;height:60px;border:2px solid var(--gold,#c8a04a);border-radius:4px;background:#2a2218;cursor:pointer;overflow:hidden;padding:0;font-family:'Heebo',sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.tablet .runbtn{height:66px;}
.runbtn:active{filter:brightness(1.12);}
.rw-row{position:absolute;top:0;bottom:0;right:44px;left:52px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;z-index:1;}
.rw-cd{width:16px;height:2px;background:#f4ecdc;opacity:.45;flex-shrink:0;}
.rw-th{position:absolute;top:50%;transform:translateY(-50%);height:20px;width:14px;display:flex;flex-direction:column;justify-content:space-between;z-index:1;pointer-events:none;}
.rw-tb{height:2px;width:100%;background:#f4ecdc;opacity:.65;border-radius:1px;}

function loadAircraftPref(){try{const s=localStorage.getItem('poh_aircraft');const j=AIRCRAFT.findIndex(a=>a.id===s);if(j>=0)acIdx=j;}catch(e){}}
loadAircraftPref();
let POH=AIRCRAFT[acIdx].rows;
function activeAircraftName(){return AIRCRAFT[acIdx].name;}
function activeThumb(){return THUMBS[AIRCRAFT[acIdx].id]||'';}
const CAT_ORDER=['white','red','yellow','green'];
const CAT_LABEL={white:'שגרה',red:'חירום',yellow:'תקלות',green:'כללי'};

let sections=[];
// כללי (green) is reference/read-only — EXCEPT tasks like החלפת מיכלים
const GREEN_TICKABLE=['החלפת מיכלים','החלפת מיכלים'];
function buildSections(){
  sections=[];const seen=new Map();
  for(const r of POH){const k=r.cat+'|'+r.sec;if(!seen.has(k)){seen.set(k,sections.length);sections.push({cat:r.cat,sec:r.sec,rows:[]});}sections[seen.get(k)].rows.push(r);}
  sections.forEach((s,i)=>{s.id=i;s.itemCount=s.rows.filter(r=>r.type==='item').length;});
  sections.forEach(s=>{ s.readonly = (s.cat==='green' && !GREEN_TICKABLE.includes(s.sec)); });
}
buildSections();
function firstOf(cat){const s=sections.find(s=>s.cat===cat);return s?s.id:0;}

function detectDevice(){
  const portrait = window.matchMedia('(orientation: portrait)').matches;
  const narrow = window.innerWidth < 700;
  return (narrow && portrait) ? 'phone' : 'tablet';
}
let device=detectDevice();
let activeCat='white';
const lastSection={};  // per-category memory
CAT_ORDER.forEach(c=>{ lastSection[c]=firstOf(c); });
let activeSection=lastSection['white'];
const ticked={};
const key=(sid,i)=>sid+':'+i;
const CHK='<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>';
function flagMark(r){return r.flag?`<span class="rflag" title="${String(r.flag).replace(/"/g,'&quot;')}">\u2691</span>`:'';}
// run-button badge glyphs: down-chevron (advance), back-chevron (next section), check (done)
const CHEV_DOWN='<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>';
const CHEV_BACK='<svg viewBox="0 0 24 24"><polyline points="15 6 9 12 15 18"/></svg>';
let curIdx=-1;  // highlighted row index within active section (-1 = none)
// first un-ticked item index in a section, or -1 if none/readonly
function firstUndone(s,from){
  if(!s||s.readonly)return -1;
  from=from||0;
  for(let i=from;i<s.rows.length;i++){if(s.rows[i].type==='item'&&!ticked[key(s.id,i)])return i;}
  for(let i=0;i<s.rows.length;i++){if(s.rows[i].type==='item'&&!ticked[key(s.id,i)])return i;}
  return -1;
}
// next section in the SAME category after the active one (for the "offer" state), or null
function nextSectionSameCat(){
  const s=sections[activeSection];
  const secs=sections.filter(x=>x.cat===s.cat);
  const pos=secs.findIndex(x=>x.id===s.id);
  return (pos>=0&&pos<secs.length-1)?secs[pos+1]:null;
}
function resetCur(){curIdx=firstUndone(sections[activeSection],0);}
// haptic buzz on tick (Android supports navigator.vibrate; iOS Safari ignores it silently)
function buzz(){try{if(navigator.vibrate)navigator.vibrate(12);}catch(e){}}

function colorbarHTML(){
  return CAT_ORDER.map(c=>{
    const dot=catHasMarks(c)?'<span class="mark cbmark"></span>':'';
    return `<div class="cb c-${c} ${c===activeCat?'act':''}" onclick="pickCat('${c}')">${CAT_LABEL[c]}${dot}</div>`;
  }).join('');
}
function sectionHasMarks(s){return s.rows.some((r,i)=>r.type==='item'&&ticked[key(s.id,i)]);}
function sectionFrac(s){
  if(s.readonly||!s.itemCount)return 0;
  const done=s.rows.filter((r,i)=>r.type==='item'&&ticked[key(s.id,i)]).length;
  return done/s.itemCount;
}
function catHasMarks(c){return sections.filter(s=>s.cat===c).some(sectionHasMarks);}
function railHTML(){
  const secs=sections.filter(s=>s.cat===activeCat);
  return secs.map(s=>{
    const cls=s.id===activeSection?'act':'';
    const f=sectionFrac(s);
    const prog=(!s.readonly&&s.itemCount)?`<span class="ptrack"><span class="pfill" style="height:${Math.round(f*100)}%"></span></span>`:'';
    return `<div class="rtab ${cls}" onclick="go(${s.id})">${prog}<span class="rlabel">${s.sec}</span></div>`;
  }).join('');
}
function bulletize(t){const p=String(t).split('\n').map(x=>x.trim()).filter(Boolean);if(p.length<=1)return `<div>${p[0]||t}</div>`;return '<ul>'+p.map(x=>`<li>${x}</li>`).join('')+'</ul>';}
function tableHTML(headRow,bodyRows){
  const cols=String(headRow.val||'').split(';').map(x=>x.trim()).filter(Boolean);
  const corner=String(headRow.sub||'').trim();
  let head='<tr><th class="corner">'+corner+'</th>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';
  let body='';
  bodyRows.forEach(r=>{
    const cells=String(r.val||'').split(';').map(x=>x.trim());
    const zone=String(r.sub||'').trim().toLowerCase();
    const zoneCls=(zone==='red'||zone==='green'||zone==='yellow'||zone==='green-soft')?(' arc-'+zone):'';

      const raw=cells[i];

      const miss=(!dash&&(raw===undefined||raw===''));
      const hasHeb=/[\u0590-\u05FF]/.test(raw||'');   // contains Hebrew (e.g. מטר)
      const dirCls=miss?'gap':(hasHeb?'num numheb':'num');
      tds+=`<td class="${dirCls}">${miss?'':(raw||'')}</td>`;
    }
    const flag=(cells.length<cols.length && !cells.slice(-1)[0]==='-')?'<span class="tflag"></span>':'';
    body+=`<tr class="${zoneCls.trim()}"><td class="rl">${r.item||''}${flag}</td>${tds}</tr>`;
  });

  const isArc=bodyRows.some(r=>['red','green','yellow','green-soft'].includes(String(r.sub||'').trim().toLowerCase()))?' arc':'';

// ── PWA launch update check ──────────────────────────────────────────
// On launch, fetch the live HTML from GitHub with a cache-buster and read
// its footer version. If it differs from the running version, do ONE guarded
// reload (sessionStorage one-shot) so the browser pulls the new file. On slow
// or failed network, fall back to the cached copy already running.
const UPDATE_URL='https://eligrt.github.io/AirCheck-POH/AirCheck_POH_TEST.html';
const UPDATE_RELOAD_FLAG='poh_update_reloaded';   // one-shot per launch, prevents loops
const UPDATE_TIMEOUT_MS=8000;                     // give up fetch after this
const UPDATE_SLOW_MS=3000;                        // escalate message after this
function updShow(msg){const w=document.getElementById('updwrap'),m=document.getElementById('updmsg');if(m)m.textContent=msg;if(w)w.classList.add('show');}
function updHide(){const w=document.getElementById('updwrap');if(w)w.classList.remove('show');}
function updVersionFrom(html){
  // pull the footer version string out of a raw HTML string
  const m=String(html).match(/v\d+\.\d+\.\d+[A-Za-z]?(?:_[A-Za-z0-9]+)?/);
  return m?m[0]:'';
}
// read the running app version from the footer DOM (local to this script scope)
function updRunningVersion(){
  const el=document.querySelector('.appfooter');
  if(!el)return'';
  const m=el.textContent.match(/v\d+\.\d+\.\d+[A-Za-z]?(?:_[A-Za-z0-9]+)?/);
  return m?m[0]:'';
}
// Render the app normally (used after the check settles, whichever way)
function bootApp(){
  updHide();
  resetCur();
  render();
  maybeShowWelcome();
}
function backToApp(){
  const from=new URLSearchParams(location.search).get('from')||'AirCheck_RD.html';
  location.href=from+'?resume=1';
}
// forced=true when triggered by the refresh button (ignores nothing special,
// but always shows the overlay and re-checks even if already current)
async function checkForUpdate(forced){
  const running=updRunningVersion();
  // If we already reloaded once this launch, don't loop — just run cached.
  let reloaded=false;
  try{reloaded=sessionStorage.getItem(UPDATE_RELOAD_FLAG)==='1';}catch(e){}
  if(reloaded && !forced){bootApp();return;}

  updShow('מוריד עדכונים...');
  const slowTimer=setTimeout(()=>updShow('חיבור איטי או תקלת רשת...'),UPDATE_SLOW_MS);

  let html=null;
  try{
    const ctrl=new AbortController();
    const to=setTimeout(()=>ctrl.abort(),UPDATE_TIMEOUT_MS);
    const res=await fetch(UPDATE_URL+'?v='+Date.now(),{cache:'no-store',signal:ctrl.signal});
    clearTimeout(to);
    if(res.ok)html=await res.text();
  }catch(e){/* offline / slow / aborted — fall through to cached */}
  clearTimeout(slowTimer);

  if(html){
    const live=updVersionFrom(html);
    if(live && live!==running && !reloaded){
      // newer (or just different) version online — reload once to pull it
      try{sessionStorage.setItem(UPDATE_RELOAD_FLAG,'1');}catch(e){}
      updShow('מוריד עדכונים...');
      location.reload();
      return;   // stop here; the reloaded page will boot fresh
    }
    if(forced && live && live===running){
      // manual check, already current — brief confirmation then continue
      updShow('אתה מעודכן ✓');
      setTimeout(bootApp,900);
      return;
    }
  } else if(forced){
    // manual check failed to reach network — tell the user we stay on local
    updShow('אין חיבור — מוצגת הגרסה המקומית');
    setTimeout(bootApp,1400);
    return;
  }
  // current, or fetch failed on a normal launch: just run what we have
  bootApp();
}
// On a fresh launch, clear the one-shot flag only when this IS the reloaded
// page showing the new version (running === live is confirmed post-reload by
// the flag already being set). We clear it here so the NEXT launch checks again.
(function(){
  let reloaded=false;
  try{reloaded=sessionStorage.getItem(UPDATE_RELOAD_FLAG)==='1';}catch(e){}
  if(reloaded){
    // We're the reloaded page. Clear flag for next launch, skip re-checking, boot.
    try{sessionStorage.removeItem(UPDATE_RELOAD_FLAG);}catch(e){}
    bootApp();
  } else {
    checkForUpdate(false);
  }
})();

/* iOS Safari: block page rubber-band. Only allow the touchmove when the
   scrollable element can actually move in the drag direction; otherwise
   the page itself bounces. */
(function(){
  var startY=0, el=null;
  function scrollableAncestor(node){
    while(node && node!==document.body){
      if(node.classList && (node.classList.contains('list')||node.classList.contains('rail'))) return node;
      node=node.parentNode;
    }
    return null;
  }
  document.addEventListener('touchstart',function(e){
    if(e.touches.length!==1) return;
    startY=e.touches[0].clientY;
    el=scrollableAncestor(e.target);
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!el||e.touches.length!==1) return;
    var dy=e.touches[0].clientY-startY;
    var atTop=el.scrollTop<=0;
    var atBottom=el.scrollTop+el.clientHeight>=el.scrollHeight-1;
    // dy>0 = dragging down (pulling top); dy<0 = dragging up (pulling bottom)
    if((atTop&&dy>0)||(atBottom&&dy<0)){
      e.preventDefault();
    }
  },{passive:false});
})();
</script>

    databaseURL: "https://aircheck-poh-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "aircheck-poh",
    storageBucket: "aircheck-poh.firebasestorage.app",
    messagingSenderId: "220461298223",
    appId: "1:220461298223:web:17d25b447930ac7b7c0cda"
  };

  const CONFIGURED = firebaseConfig.apiKey !== "REPLACE_ME";

  function getDeviceId(){
    let id=null;
    try{id=localStorage.getItem('poh_device_id');}catch(e){}
    if(!id){
      id='d_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      try{localStorage.setItem('poh_device_id',id);}catch(e){}
    }
    return id;
  }
  function getOS(){
    const ua=navigator.userAgent;
    if(/iPad|iPhone|iPod/.test(ua))return'iOS';
    if(/Android/.test(ua))return'Android';
    return'Desktop';
  }
  function getAppVersion(){
    const el=document.querySelector('.appfooter');
    if(!el)return'';
    const m=el.textContent.match(/v\d+\.\d+\.\d+[A-Za-z]?(?:_[A-Za-z0-9]+)?/);
    return m?m[0]:'';
  }

  async function syncOpen(){
    if(!CONFIGURED)return; // no-op until real config is dropped in
    try{
      const app=initializeApp(firebaseConfig);
      const db=getDatabase(app);
      const deviceId=getDeviceId();
      const now=Date.now();
      const pilotRef=ref(db,'pilots/'+deviceId);

      // Read existing first so counters/firstSeen survive a localStorage clear
      let existing={};
      try{const snap=await get(pilotRef);existing=snap.val()||{};}catch(e){}

      // Capped rolling list of launches (last 100) → powers admin windows + test/main split.
      // Each entry is {t:timestamp, v:version}. Older entries may be bare numbers (pre-v1.01.034);
      // the admin tolerates both. Tagging per-launch means switching test↔prod no longer
      // retroactively re-labels a device's history.
      const ver=getAppVersion()||existing.appVersion||'';
      const launches=Array.isArray(existing.launches)?existing.launches.slice():[];
      launches.push({t:now,v:ver});
      const trimmed=launches.slice(-100);

      // Launch counter survives clears via max(local, server)
      let localCount=0;
      try{localCount=parseInt(localStorage.getItem('poh_launch_count')||'0');}catch(e){}
      const launchCount=Math.max(localCount+1,(existing.launchCount||0)+1);
      try{localStorage.setItem('poh_launch_count',String(launchCount));}catch(e){}

      await set(pilotRef,{
        firstSeen: existing.firstSeen||now,
        lastSeen: now,
        os: getOS(),
        appVersion: ver||existing.appVersion||'',
        launchCount,
        launches: trimmed,
        daily: existing.daily||{}
      });

      // ── Daily usage bucket (weekday/weekend pattern view — future) ──
      // Separate, isolated server-side increment. Keyed by LOCAL date
      // (toLocaleDateString('en-CA') → 'YYYY-MM-DD' in device tz) so an
      // Israel-evening open lands on the right day, not UTC-tomorrow.
      // Never use toISOString(). The main set() above carries daily forward
      // (full-node set would otherwise wipe prior days); this increment then
      // bumps today. For POH the counted event is app-open (no flight-start).
      try{
        const localDay=new Date().toLocaleDateString('en-CA');
        await set(ref(db,'pilots/'+deviceId+'/daily/'+localDay),increment(1));
      }catch(e){}
    }catch(e){}
  }

  syncOpen();
</script>
