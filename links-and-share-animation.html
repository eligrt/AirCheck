<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:240px;height:489px;overflow:hidden;background:#1a1a1c;}
.phone{width:240px;height:489px;border-radius:24px;border:3px solid #444;overflow:hidden;position:relative;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.screen{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;background-position:top left;}
.finger{position:absolute;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none;opacity:0;transform:translate(-50%,-50%);}
.ripple{position:absolute;width:32px;height:32px;border-radius:50%;border:2px solid rgba(200,160,74,.9);pointer-events:none;opacity:0;transform:translate(-50%,-50%);}
.ripple-close{border-color:rgba(255,255,255,.7);}
@keyframes fingerTap{0%,10%{opacity:0;transform:translate(-50%,-50%) scale(.5);}20%{opacity:1;transform:translate(-50%,-50%) scale(1);}32%{opacity:1;transform:translate(-50%,-50%) scale(.8);}42%{opacity:1;transform:translate(-50%,-50%) scale(1);}50%,100%{opacity:0;transform:translate(-50%,-50%) scale(1);}}
@keyframes rippleTap{0%,25%{opacity:0;transform:translate(-50%,-50%) scale(1);}35%{opacity:1;transform:translate(-50%,-50%) scale(1);}50%{opacity:0;transform:translate(-50%,-50%) scale(3.5);}100%{opacity:0;transform:translate(-50%,-50%) scale(1);}}
@keyframes showDest{0%,44%{opacity:0;}52%,78%{opacity:1;}88%,100%{opacity:0;}}
@keyframes hideApp{0%,44%{opacity:1;}52%,78%{opacity:0;}88%,100%{opacity:1;}}
@keyframes fingerClose{0%,55%{opacity:0;transform:translate(-50%,-50%) scale(.5);}65%{opacity:1;transform:translate(-50%,-50%) scale(1);}75%{opacity:1;transform:translate(-50%,-50%) scale(.8);}83%{opacity:1;transform:translate(-50%,-50%) scale(1);}90%,100%{opacity:0;transform:translate(-50%,-50%) scale(1);}}
@keyframes rippleClose{0%,68%{opacity:0;transform:translate(-50%,-50%) scale(1);}75%{opacity:1;transform:translate(-50%,-50%) scale(1);}88%{opacity:0;transform:translate(-50%,-50%) scale(3.5);}100%{opacity:0;transform:translate(-50%,-50%) scale(1);}}
.run-app{animation:hideApp 5s ease-in-out infinite;}
.run-dest{animation:showDest 5s ease-in-out infinite;}
.run-tap{animation:fingerTap 5s ease-in-out infinite;}
.run-rtap{animation:rippleTap 5s ease-out infinite;}
.run-close{animation:fingerClose 5s ease-in-out infinite;}
.run-rclose{animation:rippleClose 5s ease-out infinite;}
</style>
</head>

if(key==='share'){(function(){
  var s1=SHARE[0],s2=SHARE[1],s3=SHARE[2];
  var ph=document.getElementById('phone');
  ph.innerHTML=''
    +'<div class="screen" id="sc1" style="background-image:url('+JSON.stringify(s1[2]).slice(1,-1)+')"></div>'
    +'<div class="screen" id="sc2" style="background-image:url('+JSON.stringify(s2[2]).slice(1,-1)+');opacity:0"></div>'
    +'<div class="screen" id="sc3" style="background-image:url('+JSON.stringify(s3[2]).slice(1,-1)+');opacity:0"></div>'
    +'<div class="finger" id="f1" style="left:'+s1[0]+'px;top:'+s1[1]+'px"></div>'
    +'<div class="ripple" id="r1" style="left:'+s1[0]+'px;top:'+s1[1]+'px"></div>'
    +'<div class="finger" id="f2" style="left:'+s2[0]+'px;top:'+s2[1]+'px"></div>'
    +'<div class="ripple" id="r2" style="left:'+s2[0]+'px;top:'+s2[1]+'px"></div>';
  var sc1=document.getElementById('sc1');
  var sc2=document.getElementById('sc2');
  var sc3=document.getElementById('sc3');
  var f1=document.getElementById('f1');
  var r1=document.getElementById('r1');
  var f2=document.getElementById('f2');
  var r2=document.getElementById('r2');
  var DUR=8000;
  function fadeIn(el,dur){el.style.transition='opacity '+dur+'s';el.style.opacity='1';}
  function fadeOut(el,dur){el.style.transition='opacity '+dur+'s';el.style.opacity='0';}
  // Normal quick tap
  function tap(f,r){
    r.style.animation='none';void r.offsetWidth;
    f.style.animation='fingerTap 0.7s ease forwards';
    r.style.animation='rippleTap 0.7s ease-out forwards';
  }
  // Press-and-hold: finger appears, stays visible, then lifts
  function pressHold(f,r,holdMs){
    r.style.animation='none';void r.offsetWidth;
    f.style.transition='opacity .15s';
    f.style.opacity='1';
    f.style.transform='translate(-50%,-50%) scale(1)';
    setTimeout(function(){
      f.style.transition='opacity .2s';
      f.style.opacity='0';
      f.style.transform='translate(-50%,-50%) scale(1)';
    },holdMs);
  }
  function run(){
    sc1.style.transition='none';sc1.style.opacity='1';
    sc2.style.transition='none';sc2.style.opacity='0';
    sc3.style.transition='none';sc3.style.opacity='0';
    f1.style.opacity='0';f1.style.transform='translate(-50%,-50%) scale(1)';
    [r1,f2,r2].forEach(function(el){el.style.animation='none';});
    // t=6%  press-and-hold on sc1 (end-of-list), hold ~800ms
    setTimeout(function(){pressHold(f1,r1,800);},DUR*0.06);
    // t=22% show sc2 (summary screen)
    setTimeout(function(){fadeIn(sc2,0.35);},DUR*0.22);
    // t=37% tap on sc2 (the ∨ chevron)
    setTimeout(function(){tap(f2,r2);},DUR*0.37);
    // t=52% show sc3 (whatsapp result)
    setTimeout(function(){fadeIn(sc3,0.35);},DUR*0.52);
    // t=82% fade all out, restart
    setTimeout(function(){
      fadeOut(sc1,0.4);fadeOut(sc2,0.4);fadeOut(sc3,0.4);
      setTimeout(run,500);
    },DUR*0.82);
  }
  run();
})();}
