<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AirCheck+ · מאגר קהילתי</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4ecdc;--paper-hi:#fbf6e8;--paper-edge:#e3d4ad;--paper-line:rgba(28,61,110,.055);
  --ink:#1c3d6e;--ink-muted:#5a4a3a;--ink-faint:#8a7a5a;
  --gold:#c8a04a;--gold-lite:#d4b878;--gold-deep:#8a6a2a;
  --cleared:#1f6f3f;--stamp-red:#b94a3a;--amber:#f59e0b;
  --font-ui:'IBM Plex Sans Hebrew',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:#1a1a1c;font-family:var(--font-ui);color:var(--ink);}
body{display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;}
.card{background:var(--paper);background-image:repeating-linear-gradient(0deg,transparent 0,transparent 27px,var(--paper-line) 27px,var(--paper-line) 28px);border:2px solid var(--gold);border-radius:8px;width:100%;max-width:480px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.header{background:var(--ink);padding:16px 18px;}
.header-mono{font-family:var(--font-mono);font-size:9px;color:rgba(244,236,220,.45);letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px;direction:ltr;unicode-bidi:bidi-override;}
.header-title{font-size:18px;font-weight:700;color:#f4ecdc;direction:rtl;}
.header-sub{font-size:11px;color:rgba(244,236,220,.5);margin-top:3px;direction:rtl;}
.tabs{display:flex;background:var(--paper);border-bottom:2px solid var(--gold-lite);}
.tab{flex:1;padding:10px 4px;text-align:center;font-family:var(--font-mono);font-size:8px;letter-spacing:.06em;color:var(--ink-faint);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;}
.tab.active{color:var(--ink);border-bottom-color:var(--gold);font-weight:700;}
.pills{padding:8px 14px;display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px dashed var(--gold-lite);background:var(--paper-hi);}
.pill{padding:4px 10px;border-radius:20px;border:1.5px solid var(--paper-edge);background:var(--paper);font-size:10px;font-weight:600;color:var(--ink-muted);cursor:pointer;white-space:nowrap;}
.pill.active{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.items-list{padding:10px 14px;display:flex;flex-direction:column;gap:8px;}
.empty{padding:20px;text-align:center;font-size:12px;color:var(--ink-faint);font-family:var(--font-mono);}
.item-card{background:var(--paper-hi);border:1px solid var(--paper-edge);border-radius:6px;overflow:hidden;direction:rtl;}
.item-body{padding:10px 12px;}
.item-main{font-size:14px;color:var(--ink);font-weight:600;margin-bottom:4px;}
.item-meta{font-family:var(--font-mono);font-size:8px;color:var(--ink-faint);letter-spacing:.04em;}
.tag-row{padding:8px 12px;border-top:1px dashed var(--gold-lite);display:flex;flex-wrap:wrap;gap:5px;direction:rtl;}
.tag{padding:3px 10px;border-radius:20px;border:1px solid var(--paper-edge);font-size:10px;font-weight:600;color:var(--ink-muted);cursor:pointer;background:var(--paper);}
.tag.selected{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.reject-row{padding:8px 12px;border-top:1px dashed var(--gold-lite);display:flex;flex-direction:column;gap:6px;direction:rtl;}
.reject-reasons{display:flex;flex-wrap:wrap;gap:5px;}
.rtag{padding:3px 10px;border-radius:20px;border:1px solid rgba(185,74,58,.3);font-size:10px;font-weight:600;color:var(--stamp-red);cursor:pointer;background:rgba(185,74,58,.04);}
.rtag.selected{background:var(--stamp-red);color:var(--paper);border-color:var(--stamp-red);}
.reject-note{padding:6px 10px;background:var(--paper);border:1px solid var(--paper-edge);border-radius:4px;font-family:var(--font-ui);font-size:11px;color:var(--ink);direction:rtl;outline:none;width:100%;}
.rename-row{padding:7px 12px;border-top:1px dashed var(--gold-lite);display:flex;gap:6px;align-items:center;}
.rename-input{flex:1;padding:7px 10px;background:var(--paper);border:1.5px solid var(--gold);border-radius:4px;font-family:var(--font-ui);font-size:12px;color:var(--ink);direction:rtl;outline:none;}
.rename-confirm{padding:7px 12px;background:var(--ink);border:none;border-radius:4px;color:var(--paper);font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font-ui);white-space:nowrap;}
.rename-confirm:disabled{opacity:.35;cursor:default;}
.actions{display:flex;border-top:1px dashed var(--gold-lite);}
.act{flex:1;padding:9px 4px;text-align:center;font-size:11px;font-weight:700;cursor:pointer;background:transparent;border:none;font-family:var(--font-ui);}
.act:not(:last-child){border-left:1px dashed var(--gold-lite);}
.act.approve{color:var(--cleared);}
.act.approve:disabled{opacity:.35;cursor:default;}
.act.rename{color:var(--ink-muted);}
.act.reject{color:var(--stamp-red);}
.act.back{color:var(--amber);}
.act.confirm-reject{color:var(--paper);background:var(--stamp-red);}
.appr-item{background:var(--paper-hi);border:1px solid rgba(31,111,63,.2);border-radius:6px;overflow:hidden;direction:rtl;}
.appr-body{padding:10px 12px;display:flex;align-items:center;gap:8px;}
.appr-tag{flex-shrink:0;font-family:var(--font-mono);font-size:8px;background:rgba(31,111,63,.1);color:var(--cleared);padding:2px 7px;border-radius:3px;letter-spacing:.04em;}
.rej-item{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:var(--paper-hi);border:1px solid rgba(185,74,58,.15);border-radius:6px;direction:rtl;}
.rej-badge{flex-shrink:0;margin-top:2px;font-family:var(--font-mono);font-size:8px;background:rgba(185,74,58,.08);color:var(--stamp-red);padding:2px 6px;border-radius:3px;letter-spacing:.04em;white-space:nowrap;}
.rej-reason{font-size:10px;color:var(--ink-faint);margin-top:2px;font-style:italic;}
/* tags management tab */
.tags-body{padding:14px;}
.tag-mgmt-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--paper-hi);border:1px solid var(--paper-edge);border-radius:6px;margin-bottom:6px;direction:rtl;}
.tag-mgmt-name{flex:1;font-size:13px;color:var(--ink);font-weight:600;}
.tag-mgmt-count{font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);}
.tag-del{background:transparent;border:none;color:var(--stamp-red);font-size:14px;cursor:pointer;padding:0 4px;line-height:1;}
.tag-add-row{display:flex;gap:8px;margin-top:10px;}
.tag-add-input{flex:1;padding:9px 12px;background:var(--paper-hi);border:1.5px solid var(--gold-lite);border-radius:6px;font-family:var(--font-ui);font-size:13px;color:var(--ink);direction:rtl;outline:none;}
.tag-add-input:focus{border-color:var(--ink);}
.tag-add-btn{padding:9px 16px;background:var(--ink);border:none;border-radius:6px;color:var(--paper);font-family:var(--font-ui);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.tag-add-btn:disabled{opacity:.35;cursor:default;}
.loading{padding:30px;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);letter-spacing:.1em;}
.footer{padding:10px 14px;border-top:1px dashed var(--gold-lite);text-align:center;}
.footer-txt{font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);letter-spacing:.1em;}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="header-mono">AirCheck+ · COMMUNITY REPOSITORY · v1.01.003</div>
    <div class="header-title">ניהול מאגר קהילתי</div>
    <div class="header-sub" id="headerSub">טוען...</div>
  </div>
  <div class="tabs">
    <div class="tab active" id="tab-pending" onclick="switchTab('pending')">ממתינים</div>
    <div class="tab" id="tab-approved" onclick="switchTab('approved')">מאושרים</div>
    <div class="tab" id="tab-rejected" onclick="switchTab('rejected')">נדחו</div>
    <div class="tab" id="tab-tags" onclick="switchTab('tags')">תגיות</div>
  </div>
  <div class="pills" id="pillsRow" style="display:none;"></div>
  <div class="items-list" id="itemsList"><div class="loading">טוען נתונים...</div></div>
  <div class="footer">
    <div class="footer-txt">AirCheck+ · CUSTOM REPOSITORY · v1.01.003 · eligrt</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getDatabase, ref, set, get, remove } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBoW1O9dTanLUZW5Z8jswn3hxpfFSdmzm0",
  authDomain: "aircheck-80530.firebaseapp.com",
  databaseURL: "https://aircheck-80530-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "aircheck-80530",
  storageBucket: "aircheck-80530.firebasestorage.app",
  messagingSenderId: "816746630548",
  appId: "1:816746630548:web:dac8392deff9b96cc9d381"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const DEFAULT_TAGS = ['מזג אוויר','ניירת','ציוד','מטוס','בטיחות','תקשורת','כללי'];
const REJECT_REASONS = ['זבל','כפול','פוגעני','אחר'];

let currentTab = 'pending';
let allData = { pending:{}, approved:{}, rejected:{} };
let tags = [...DEFAULT_TAGS];
let activeFilter = 'הכל';
let itemStates = {};

async function loadAll(){
  try{
    const snap = await get(ref(db,'community'));
    const val = snap.val() || {};
    allData.pending = val.pending || {};
    allData.approved = val.approved || {};
    allData.rejected = val.rejected || {};
    // Load tags from Firebase, fall back to defaults
    if(val.tags && Array.isArray(val.tags)) tags = val.tags;
    else { tags = [...DEFAULT_TAGS]; await set(ref(db,'community/tags'), tags); }
    updateHeader();
    render();
  }catch(e){
    document.getElementById('itemsList').innerHTML = '<div class="empty">שגיאה בטעינת נתונים</div>';
  }
}

function updateHeader(){
  const p = Object.keys(allData.pending).length;
  const a = Object.keys(allData.approved).length;
  const r = Object.keys(allData.rejected).length;
  document.getElementById('headerSub').textContent = `${p} ממתינים · ${a} מאושרים · ${r} נדחו · ${tags.length} תגיות`;
  document.getElementById('tab-pending').textContent = `ממתינים (${p})`;
  document.getElementById('tab-approved').textContent = `מאושרים (${a})`;
  document.getElementById('tab-rejected').textContent = `נדחו (${r})`;
}

window.switchTab = function(tab){
  currentTab = tab;
  activeFilter = 'הכל';
  itemStates = {};
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  render();
};

function render(){
  const pillsRow = document.getElementById('pillsRow');
  if(currentTab==='tags'){ pillsRow.style.display='none'; renderTagsTab(); return; }
  pillsRow.style.display='';
  renderPills();
  renderItems();
}

function renderPills(){
  const pills = document.getElementById('pillsRow');
  const options = currentTab==='rejected' ? ['הכל',...REJECT_REASONS] : ['הכל',...tags];
  pills.innerHTML = options.map(p=>
    `<div class="pill${activeFilter===p?' active':''}" onclick="setFilter('${p}')">${p}</div>`
  ).join('');
}

window.setFilter = function(f){ activeFilter=f; renderPills(); renderItems(); };

function timeAgo(ts){
  if(!ts)return '—';
  const diff=Date.now()-ts;
  const mins=Math.floor(diff/60000);
  if(mins<60)return `לפני ${mins} דקות`;
  const hrs=Math.floor(diff/3600000);
  if(hrs<24)return `לפני ${hrs} שעות`;
  return `לפני ${Math.floor(diff/86400000)} ימים`;
}

function renderItems(){
  const list=document.getElementById('itemsList');
  const data=allData[currentTab];
  const entries=Object.entries(data);
  const filtered=entries.filter(([id,item])=>{
    if(activeFilter==='הכל')return true;
    if(currentTab==='rejected')return item.reason===activeFilter;
    return item.tag===activeFilter;
  });
  if(!filtered.length){
    list.innerHTML=`<div class="empty">אין פריטים${activeFilter!=='הכל'?' בקטגוריה זו':''}</div>`;
    return;
  }
  filtered.sort((a,b)=>(b[1].timestamp||0)-(a[1].timestamp||0));
  list.innerHTML='';
  filtered.forEach(([id,item])=>list.appendChild(buildItem(id,item)));
}

function renderTagsTab(){
  const list = document.getElementById('itemsList');
  // Count usage per tag
  const usage = {};
  tags.forEach(t=>usage[t]=0);
  Object.values(allData.approved).forEach(item=>{ if(item.tag&&usage[item.tag]!==undefined) usage[item.tag]++; });

  let html = '<div class="tags-body">';
  if(!tags.length) html += '<div class="empty">אין תגיות עדיין</div>';
  tags.forEach(t=>{
    const count = usage[t]||0;
    const canDelete = count===0;
    html += `<div class="tag-mgmt-item">
      <span class="tag-mgmt-name">${t}</span>
      <span class="tag-mgmt-count">${count} פריטים</span>
      ${canDelete
        ? `<button class="tag-del" onclick="deleteTag('${t}')" title="מחק תגית">✕</button>`
        : `<button class="tag-del" style="opacity:.25;cursor:default;" title="לא ניתן למחוק — בשימוש">✕</button>`
      }
    </div>`;
  });
  html += `<div class="tag-add-row">
    <input class="tag-add-input" id="newTagInput" placeholder="שם תגית חדשה..." oninput="document.getElementById('addTagBtn').disabled=!this.value.trim()">
    <button class="tag-add-btn" id="addTagBtn" disabled onclick="addTag()">הוסף ›</button>
  </div>`;
  html += '</div>';
  list.innerHTML = html;
}

window.addTag = async function(){
  const input = document.getElementById('newTagInput');
  const name = (input.value||'').trim();
  if(!name || tags.includes(name)) return;
  tags.push(name);
  try{
    await set(ref(db,'community/tags'), tags);
    updateHeader();
    renderTagsTab();
  }catch(e){ alert('שגיאה: '+e.message); tags.pop(); }
};

window.deleteTag = async function(tag){
  const idx = tags.indexOf(tag);
  if(idx===-1)return;
  tags.splice(idx,1);
  try{
    await set(ref(db,'community/tags'), tags);
    updateHeader();
    renderTagsTab();
  }catch(e){ alert('שגיאה: '+e.message); tags.splice(idx,0,tag); }
};

function getState(id){
  const src = allData[currentTab][id] || {};
  if(!itemStates[id]) itemStates[id]={mode:'none', tag:src.tag||'', renameVal:src.text||'', reason:'', note:''};
  return itemStates[id];
}

function buildItem(id, item){
  if(currentTab==='rejected') return buildRejectedItem(id, item);
  const state = getState(id);
  const isApproved = currentTab==='approved';
  const card = document.createElement('div');
  card.className = isApproved ? 'appr-item' : 'item-card';
  card.id = 'item-'+id;

  // Body
  const body = document.createElement('div');
  body.className = isApproved ? 'appr-body' : 'item-body';
  if(isApproved){
    body.innerHTML = `
      <div style="flex:1;font-size:13px;color:var(--ink);font-weight:600;">${item.text||'—'}</div>
      <div class="appr-tag">${item.tag||'כללי'}</div>
    `;
  } else {
    body.innerHTML = `
      <div class="item-main">${item.text||'—'}</div>
      <div class="item-meta">${timeAgo(item.timestamp)} · #${(item.deviceId||'').slice(-4)}</div>
    `;
  }
  card.appendChild(body);

  const isApproveMode = state.mode==='approve';
  const isRenameMode = state.mode==='rename';
  const isRejectMode = state.mode==='reject';

  // Tag picker — shown in approve or rename mode
  if(isApproveMode || isRenameMode){
    const tagRow = document.createElement('div');
    tagRow.className = 'tag-row';
    tagRow.innerHTML = tags.map(t=>
      `<div class="tag${state.tag===t?' selected':''}" onclick="selectTag('${id}','${t}')">${t}</div>`
    ).join('');
    card.appendChild(tagRow);
  }

  // Rename input
  if(isRenameMode){
    const renameRow = document.createElement('div');
    renameRow.className = 'rename-row';
    renameRow.innerHTML = `
      <input class="rename-input" id="rename-${id}" value="${(state.renameVal||'').replace(/"/g,'&quot;')}" oninput="updateRename('${id}',this.value)">
      <button class="rename-confirm" id="renameConfirm-${id}" onclick="doApprove('${id}')" ${state.tag?'':'disabled'}>אשר ›</button>
    `;
    card.appendChild(renameRow);
  }

  // Reject reason
  if(isRejectMode){
    const rejectRow = document.createElement('div');
    rejectRow.className = 'reject-row';
    rejectRow.innerHTML = `
      <div class="reject-reasons">
        ${REJECT_REASONS.map(r=>`<div class="rtag${state.reason===r?' selected':''}" onclick="selectReason('${id}','${r}')">${r}</div>`).join('')}
      </div>
      <input class="reject-note" placeholder="הערה נוספת (אופציונלי)..." value="${(state.note||'').replace(/"/g,'&quot;')}" oninput="updateNote('${id}',this.value)">
    `;
    card.appendChild(rejectRow);
  }

  // Actions
  const actions = document.createElement('div');
  actions.className = 'actions';

  if(isRejectMode){
    actions.innerHTML = `
      <button class="act rename" onclick="setMode('${id}','none')">ביטול</button>
      <button class="act confirm-reject" onclick="doReject('${id}')">✕ אשר דחייה</button>
    `;
  } else if(isApproved){
    actions.innerHTML = `
      <button class="act back" onclick="doMoveToPending('${id}')">↩ החזר</button>
      <button class="act rename" onclick="setMode('${id}','${isRenameMode?'none':'rename'}')">${isRenameMode?'סגור':'✎ שנה שם'}</button>
      <button class="act reject" onclick="setMode('${id}','reject')">✕ דחה</button>
    `;
  } else if(isApproveMode){
    actions.innerHTML = `
      <button class="act rename" onclick="setMode('${id}','none')">ביטול</button>
      <button class="act rename" onclick="setMode('${id}','rename')">✎ שנה שם</button>
      <button class="act approve" id="approveConfirm-${id}" onclick="doApprove('${id}')" ${state.tag?'':'disabled'}>✓ אשר</button>
    `;
  } else {
    actions.innerHTML = `
      <button class="act approve" onclick="setMode('${id}','approve')">✓ אשר</button>
      <button class="act rename" onclick="setMode('${id}','rename')">✎ שנה שם</button>
      <button class="act reject" onclick="setMode('${id}','reject')">✕ דחה</button>
    `;
  }
  card.appendChild(actions);
  return card;
}

function buildRejectedItem(id, item){
  const div = document.createElement('div');
  div.className = 'rej-item';
  div.id = 'item-'+id;
  div.innerHTML = `
    <div style="flex:1;">
      <div style="font-size:13px;color:var(--ink-muted);font-weight:600;">${item.text||'—'}</div>
      <div class="rej-reason">${item.reason||''}${item.note?' · '+item.note:''}</div>
      <div style="font-family:var(--font-mono);font-size:8px;color:var(--ink-faint);margin-top:3px;">${timeAgo(item.timestamp)}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">
      <div class="rej-badge">נדחה</div>
      <button onclick="doMoveToPending('${id}')" style="font-size:9px;color:var(--amber);background:transparent;border:none;cursor:pointer;font-family:var(--font-ui);white-space:nowrap;">↩ החזר</button>
    </div>
  `;
  return div;
}

window.setMode = function(id, mode){
  const state = getState(id);
  state.mode = state.mode===mode ? 'none' : mode;
  rerenderItem(id);
};

window.selectTag = function(id, tag){
  const state = getState(id);
  state.tag = state.tag===tag ? '' : tag;
  rerenderItem(id);
};

window.selectReason = function(id, reason){
  getState(id).reason = getState(id).reason===reason ? '' : reason;
  rerenderItem(id);
};

window.updateRename = function(id, val){
  getState(id).renameVal = val;
  const btn = document.getElementById('renameConfirm-'+id);
  if(btn) btn.disabled = !getState(id).tag;
};

window.updateNote = function(id, val){ getState(id).note=val; };

function rerenderItem(id){
  const card = document.getElementById('item-'+id);
  if(card) card.replaceWith(buildItem(id, allData[currentTab][id]));
}

window.doApprove = async function(id){
  const item = allData[currentTab][id] || allData.pending[id] || {};
  const state = getState(id);
  if(!state.tag){ alert('יש לבחור תגית לפני האישור'); return; }
  const text = (state.mode==='rename' && state.renameVal) ? state.renameVal.trim() : item.text;
  const tag = state.tag;
  try{
    await set(ref(db,'community/approved/'+id),{text, tag, timestamp:Date.now(), originalText:item.text, deviceId:item.deviceId});
    await remove(ref(db,'community/pending/'+id));
    delete allData.pending[id];
    allData.approved[id]={text, tag, timestamp:Date.now(), deviceId:item.deviceId};
    delete itemStates[id];
    updateHeader();
    renderItems();
  }catch(e){ alert('שגיאה: '+e.message); }
};

window.doReject = async function(id){
  const item = allData[currentTab][id] || {};
  const state = getState(id);
  try{
    await set(ref(db,'community/rejected/'+id),{text:item.text, reason:state.reason||'', note:state.note||'', timestamp:Date.now(), deviceId:item.deviceId});
    await remove(ref(db,'community/'+currentTab+'/'+id));
    delete allData[currentTab][id];
    allData.rejected[id]={text:item.text, reason:state.reason||'', note:state.note||'', timestamp:Date.now()};
    delete itemStates[id];
    updateHeader();
    renderItems();
  }catch(e){ alert('שגיאה: '+e.message); }
};

window.doMoveToPending = async function(id){
  const item = allData[currentTab][id] || {};
  try{
    await set(ref(db,'community/pending/'+id),{text:item.text, timestamp:item.timestamp||Date.now(), deviceId:item.deviceId||''});
    await remove(ref(db,'community/'+currentTab+'/'+id));
    delete allData[currentTab][id];
    allData.pending[id]={text:item.text, timestamp:item.timestamp||Date.now(), deviceId:item.deviceId||''};
    delete itemStates[id];
    updateHeader();
    renderItems();
  }catch(e){ alert('שגיאה: '+e.message); }
};

loadAll();
</script>
