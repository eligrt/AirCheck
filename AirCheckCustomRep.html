<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AirCheck+ · Repository</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4ecdc;--paper-hi:#fbf6e8;--paper-edge:#e3d4ad;--paper-line:rgba(28,61,110,.055);
  --ink:#1c3d6e;--ink-muted:#5a4a3a;--ink-faint:#8a7a5a;
  --gold:#c8a04a;--gold-lite:#d4b878;--gold-deep:#8a6a2a;
  --cleared:#1f6f3f;--stamp-red:#b94a3a;--amber:#f59e0b;
  --font-ui:'IBM Plex Sans Hebrew',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--paper);font-family:var(--font-ui);color:var(--ink);}
body{display:flex;flex-direction:column;height:100svh;overflow:hidden;}
.card{background:var(--paper);background-image:repeating-linear-gradient(0deg,transparent 0,transparent 27px,var(--paper-line) 27px,var(--paper-line) 28px);width:100%;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.header{background:var(--ink);padding:10px 16px 8px;position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.header-title{font-size:18px;font-weight:700;color:#f4ecdc;direction:rtl;text-align:right;text-transform:uppercase;letter-spacing:.02em;}
.tabs{display:flex;background:var(--paper-hi);border-bottom:1px solid var(--paper-edge);flex-shrink:0;}
.tab{flex:1;padding:10px 4px;text-align:center;font-family:var(--font-ui);font-size:13px;font-weight:400;color:var(--ink-faint);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;background:transparent;border-top:none;border-right:none;border-left:none;}
.tab.active{background:var(--paper);border-bottom-color:var(--gold);color:var(--ink);font-weight:700;}
.pills{padding:8px 14px;display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px dashed var(--gold-lite);background:var(--paper-hi);flex-shrink:0;}
.pill{padding:4px 10px;border-radius:20px;border:1.5px solid var(--paper-edge);background:var(--paper);font-size:10px;font-weight:600;color:var(--ink-muted);cursor:pointer;white-space:nowrap;}
.pill.active{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.items-list{padding:10px 14px;display:flex;flex-direction:column;gap:8px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.empty{padding:20px;text-align:center;font-size:12px;color:var(--ink-faint);font-family:var(--font-ui);}
.item-card{background:var(--paper-hi);border:1px solid var(--paper-edge);border-radius:6px;overflow:hidden;direction:rtl;flex-shrink:0;}
.item-body{padding:10px 12px;}
.item-main{font-size:14px;color:var(--ink);font-weight:600;margin-bottom:4px;}
.item-meta{font-family:var(--font-mono);font-size:8px;color:var(--ink-faint);letter-spacing:.04em;}
.tag-row{padding:8px 12px;border-top:1px dashed var(--gold-lite);display:flex;flex-wrap:wrap;gap:5px;direction:rtl;}
.tag{padding:3px 10px;border-radius:20px;border:1px solid var(--paper-edge);font-size:10px;font-weight:600;color:var(--ink-muted);cursor:pointer;background:var(--paper);}
.tag.selected{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.reject-row{padding:8px 12px;border-top:1px dashed var(--gold-lite);display:flex;flex-direction:column;gap:6px;direction:rtl;}
.reject-reasons{display:flex;flex-wrap:wrap;gap:5px;}
.rtag{padding:3px 10px;border-radius:20px;border:1px solid rgba(185,74,58,.3);font-size:10px;font-weight:600;color:var(--stamp-red);cursor:pointer;background:rgba(185,74,58,.04);}
.rtag.selected{background:var(--stamp-red);color:var(--paper);border-color:var(--stamp-red);}
.reject-note{padding:6px 10px;background:var(--paper);border:1px solid var(--paper-edge);border-radius:4px;font-family:var(--font-ui);font-size:11px;color:var(--ink);direction:rtl;outline:none;width:100%;}
.rename-row{padding:7px 12px;border-top:1px dashed var(--gold-lite);display:flex;gap:6px;align-items:center;}
.rename-input{flex:1;padding:7px 10px;background:var(--paper);border:1.5px solid var(--gold);border-radius:4px;font-family:var(--font-ui);font-size:12px;color:var(--ink);direction:rtl;outline:none;}
.rename-confirm{padding:7px 12px;background:var(--ink);border:none;border-radius:4px;color:var(--paper);font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font-ui);white-space:nowrap;}
.rename-confirm:disabled{opacity:.35;cursor:default;}
.actions{display:flex;border-top:1px dashed var(--gold-lite);}
.act{flex:1;padding:9px 4px;text-align:center;font-size:11px;font-weight:700;cursor:pointer;background:transparent;border:none;font-family:var(--font-ui);}
.act:not(:last-child){border-left:1px dashed var(--gold-lite);}
.act.approve{color:var(--cleared);}
.act.approve:disabled{opacity:.35;cursor:default;}
.act.rename{color:var(--ink-muted);}
.act.reject{color:var(--stamp-red);}
.act.back{color:var(--amber);}
.act.confirm-reject{color:var(--paper);background:var(--stamp-red);}
.appr-item{background:var(--paper-hi);border:1px solid rgba(31,111,63,.2);border-radius:6px;overflow:hidden;direction:rtl;flex-shrink:0;}
.appr-body{padding:10px 12px;display:flex;align-items:center;gap:8px;}
.appr-tag{flex-shrink:0;font-family:var(--font-mono);font-size:8px;background:rgba(31,111,63,.1);color:var(--cleared);padding:2px 7px;border-radius:3px;letter-spacing:.04em;}
.rej-item{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:var(--paper-hi);border:1px solid rgba(185,74,58,.15);border-radius:6px;direction:rtl;}
.rej-badge{flex-shrink:0;margin-top:2px;font-family:var(--font-mono);font-size:8px;background:rgba(185,74,58,.08);color:var(--stamp-red);padding:2px 6px;border-radius:3px;letter-spacing:.04em;white-space:nowrap;}
.rej-reason{font-size:10px;color:var(--ink-faint);margin-top:2px;font-style:italic;}
/* tags management tab */
.tags-body{padding:14px;display:flex;flex-direction:column;gap:12px;}
.tags-section{background:var(--paper-hi);border:1px solid var(--paper-edge);border-radius:6px;overflow:hidden;}
.tags-section-header{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;direction:rtl;user-select:none;}
.tags-section-title{flex:1;font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--ink);}
.tags-section-meta{font-family:var(--font-ui);font-size:11px;color:var(--ink-faint);}
.tags-section-toggle{font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.tags-section-body{padding:0 12px 10px;display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--gold-lite);}
.tags-section-body.collapsed{display:none;}
.tag-mgmt-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--paper);border:1px solid var(--paper-edge);border-radius:5px;direction:rtl;margin-top:6px;}
.tag-mgmt-item:first-child{margin-top:8px;}
.tag-mgmt-name{flex:1;font-size:13px;color:var(--ink);font-weight:600;}
.tag-mgmt-count{font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);}
.tag-mgmt-btn{background:transparent;border:none;font-size:13px;cursor:pointer;padding:0 3px;line-height:1;}
.tag-mgmt-btn.del{color:var(--stamp-red);}
.tag-mgmt-btn.ren{color:var(--ink-muted);}
.tag-rename-row{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--paper);border:1px solid var(--gold);border-radius:5px;margin-top:6px;}
.tag-rename-row:first-child{margin-top:8px;}
.tag-rename-input{flex:1;padding:5px 8px;background:var(--paper-hi);border:1px solid var(--gold-lite);border-radius:3px;font-family:var(--font-ui);font-size:12px;color:var(--ink);direction:rtl;outline:none;}
.tag-rename-save{padding:5px 10px;background:var(--ink);border:none;border-radius:3px;color:var(--paper);font-size:10px;font-weight:700;cursor:pointer;font-family:var(--font-ui);white-space:nowrap;}
.tag-rename-cancel{padding:5px 8px;background:transparent;border:1px solid var(--paper-edge);border-radius:3px;color:var(--ink-muted);font-size:10px;cursor:pointer;font-family:var(--font-ui);}
.tag-add-row{display:flex;gap:8px;margin-top:8px;padding:0 0 2px;}
.tag-add-input{flex:1;padding:8px 10px;background:var(--paper);border:1.5px solid var(--gold-lite);border-radius:5px;font-family:var(--font-ui);font-size:12px;color:var(--ink);direction:rtl;outline:none;}
.tag-add-input:focus{border-color:var(--ink);}
.tag-add-btn{padding:8px 14px;background:var(--ink);border:none;border-radius:5px;color:var(--paper);font-family:var(--font-ui);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.tag-add-btn:disabled{opacity:.35;cursor:default;}
/* edit mode expanded card */
.edit-expanded{background:var(--paper);border-top:2px solid var(--gold);padding:10px 12px;direction:rtl;}
.edit-label{font-family:var(--font-mono);font-size:8px;color:var(--ink-faint);letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px;}
.edit-text-input{width:100%;padding:8px 10px;background:var(--paper-hi);border:1.5px solid var(--gold);border-radius:4px;font-family:var(--font-ui);font-size:13px;color:var(--ink);direction:rtl;outline:none;margin-bottom:10px;}
.edit-save-row{display:flex;gap:8px;justify-content:flex-start;}
.btn-save{padding:7px 16px;background:var(--ink);border:none;border-radius:5px;color:var(--paper);font-family:var(--font-ui);font-size:12px;font-weight:700;cursor:pointer;}
.btn-cancel{padding:7px 12px;background:transparent;border:1.5px solid var(--paper-edge);border-radius:5px;color:var(--ink-muted);font-family:var(--font-ui);font-size:12px;cursor:pointer;}
/* back button as real button */
.act.back{color:var(--amber);}
.loading{padding:30px;text-align:center;font-family:var(--font-ui);font-size:12px;color:var(--ink-faint);}
.footer{padding:10px 14px;border-top:1px solid var(--gold-lite);text-align:center;flex-shrink:0;}

/* ── PC LAYOUT: constrain to centered card, dark surround ── */
@media(min-width:600px){
  html{background:#1a1a1c;}
  body{max-width:480px;margin:0 auto;border-left:2px solid var(--gold);border-right:2px solid var(--gold);box-shadow:0 0 60px rgba(0,0,0,.6);}
}
.footer-txt{font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);letter-spacing:.1em;text-transform:uppercase;}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div>
      <div class="header-title">Repository</div>
    </div>
    <button onclick="backToApp()" style="background:transparent;border:1px solid var(--stamp-red);border-radius:6px;padding:7px 14px;font-family:var(--font-ui);font-size:13px;font-weight:600;color:#e8847a;cursor:pointer;white-space:nowrap;flex-shrink:0;">חזרה ל&nbsp;&nbsp;<span dir="ltr">ADMIN</span></button>
  </div>
  <div class="tabs">
    <button class="tab active" id="tab-pending" onclick="switchTab('pending')">ממתינים</button>
    <button class="tab" id="tab-approved" onclick="switchTab('approved')">מאושרים</button>
    <button class="tab" id="tab-rejected" onclick="switchTab('rejected')">נדחו</button>
    <button class="tab" id="tab-tags" onclick="switchTab('tags')">תגיות</button>
  </div>
  <div class="pills" id="pillsRow" style="display:none;"></div>
  <div class="items-list" id="itemsList"><div class="loading">טוען נתונים...</div></div>
  <div class="footer" dir="ltr">
    <div class="footer-txt">AirCheck+ · Repository · v1.30 · built by eligrt</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getDatabase, ref, set, get, remove } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBoW1O9dTanLUZW5Z8jswn3hxpfFSdmzm0",
  authDomain: "aircheck-80530.firebaseapp.com",
  databaseURL: "https://aircheck-80530-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "aircheck-80530",
  storageBucket: "aircheck-80530.firebasestorage.app",
  messagingSenderId: "816746630548",
  appId: "1:816746630548:web:dac8392deff9b96cc9d381"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const DEFAULT_TAGS = ['מזג אוויר','ניירת','ציוד','מטוס','בטיחות','תקשורת','כללי'];
const DEFAULT_REJECT_REASONS = ['זבל','כפול','פוגעני','אחר'];

let currentTab = 'pending';
let allData = { pending:{}, approved:{}, rejected:{} };
let tags = [...DEFAULT_TAGS];
let rejectReasons = [...DEFAULT_REJECT_REASONS];
let activeFilter = 'הכל';
let itemStates = {};
let tagsSectionState = { approve: true, reject: true }; // true = expanded
let renamingTag = null; // { list:'tags'|'reject', idx, val }

async function loadAll(){
  try{
    const snap = await get(ref(db,'community'));
    const val = snap.val()||{};
    allData.pending = val.pending||{};
    allData.approved = val.approved||{};
    allData.rejected = val.rejected||{};
    if(val.tags && Array.isArray(val.tags)) tags = val.tags;
    else { tags=[...DEFAULT_TAGS]; await set(ref(db,'community/tags'),tags); }
    if(val.rejectReasons && Array.isArray(val.rejectReasons)) rejectReasons = val.rejectReasons;
    else { rejectReasons=[...DEFAULT_REJECT_REASONS]; await set(ref(db,'community/rejectReasons'),rejectReasons); }
    updateHeader(); render();
  }catch(e){ document.getElementById('itemsList').innerHTML='<div class="empty">שגיאה בטעינת נתונים</div>'; }
}

function updateHeader(){
  const p=Object.keys(allData.pending).length, a=Object.keys(allData.approved).length, r=Object.keys(allData.rejected).length;
  document.getElementById('tab-pending').textContent=`ממתינים (${p})`;
  document.getElementById('tab-approved').textContent=`מאושרים (${a})`;
  document.getElementById('tab-rejected').textContent=`נדחו (${r})`;
}

window.backToApp=function(){
  const params=new URLSearchParams(window.location.search);
  const from=params.get('from')||'AirCheck_RD_test.html';
  const tab=params.get('tab');
  window.location.href=tab?(from+'?tab='+tab):from;
};

window.switchTab=function(tab){
  currentTab=tab; activeFilter='הכל'; itemStates={}; renamingTag=null;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  render();
};

function render(){
  const pillsRow=document.getElementById('pillsRow');
  if(currentTab==='tags'){ pillsRow.style.display='none'; renderTagsTab(); return; }
  pillsRow.style.display=''; renderPills(); renderItems();
}

function renderPills(){
  const options=currentTab==='rejected'?['הכל',...rejectReasons]:['הכל',...tags];
  document.getElementById('pillsRow').innerHTML=options.map(p=>
    `<div class="pill${activeFilter===p?' active':''}" onclick="setFilter('${p}')">${p}</div>`
  ).join('');
}
window.setFilter=function(f){ activeFilter=f; renderPills(); renderItems(); };

function timeAgo(ts){
  if(!ts)return '—';
  const d=Date.now()-ts, m=Math.floor(d/60000);
  if(m<60)return `לפני ${m} דקות`;
  const h=Math.floor(d/3600000);
  if(h<24)return `לפני ${h} שעות`;
  return `לפני ${Math.floor(d/86400000)} ימים`;
}

function renderItems(){
  const list=document.getElementById('itemsList');
  const entries=Object.entries(allData[currentTab]);
  const filtered=entries.filter(([id,item])=>{
    if(activeFilter==='הכל')return true;
    return currentTab==='rejected'?item.reason===activeFilter:item.tag===activeFilter;
  });
  if(!filtered.length){ list.innerHTML=`<div class="empty">אין פריטים${activeFilter!=='הכל'?' בקטגוריה זו':''}</div>`; return; }
  filtered.sort((a,b)=>(b[1].timestamp||0)-(a[1].timestamp||0));
  list.innerHTML='';
  filtered.forEach(([id,item])=>list.appendChild(buildItem(id,item)));
}

function getState(id){
  if(!itemStates[id]){ const src=allData[currentTab][id]||{}; itemStates[id]={mode:'none',editVal:src.text||'',editTag:src.tag||'',reason:'',note:''}; }
  return itemStates[id];
}

function buildItem(id,item){
  if(currentTab==='rejected') return buildRejectedItem(id,item);
  const state=getState(id);
  const isApproved=currentTab==='approved';
  const card=document.createElement('div');
  card.className=isApproved?'appr-item':'item-card';
  card.id='item-'+id;

  // ── BODY ──
  if(state.mode==='edit'){
    // Expanded edit panel
    const exp=document.createElement('div');
    exp.className='edit-expanded';
    exp.innerHTML=`
      <div class="edit-label">עריכת טקסט</div>
      <input class="edit-text-input" id="editInput-${id}" value="${(state.editVal||'').replace(/"/g,'&quot;')}" oninput="updateEdit('${id}',this.value)">
      ${isApproved?`<div class="edit-label" style="margin-top:2px;">קטגוריה</div>
      <div class="reject-reasons" style="flex-wrap:wrap;gap:5px;display:flex;margin-bottom:10px;">
        ${tags.map(t=>`<div class="tag${state.editTag===t?' selected':''}" onclick="selectEditTag('${id}','${t}')">${t}</div>`).join('')}
      </div>`:''}
      <div class="edit-save-row">
        <button class="btn-save" onclick="saveEdit('${id}')">✓ שמור</button>
        <button class="btn-cancel" onclick="setMode('${id}','none')">ביטול</button>
      </div>
    `;
    card.appendChild(exp);
  } else if(isApproved){
    const body=document.createElement('div');
    body.className='appr-body';
    body.innerHTML=`<div style="flex:1;font-size:13px;color:var(--ink);font-weight:600;">${item.text||'—'}</div><div class="appr-tag">${item.tag||'כללי'}</div>`;
    card.appendChild(body);
  } else {
    const body=document.createElement('div');
    body.className='item-body';
    body.innerHTML=`<div class="item-main">${item.text||'—'}</div><div class="item-meta">${timeAgo(item.timestamp)} · #${(item.deviceId||'').slice(-4)}</div>`;
    card.appendChild(body);
  }

  // ── APPROVE tag picker ──
  if(state.mode==='approve'){
    const row=document.createElement('div');
    row.className='tag-row';
    row.innerHTML=`<span style="font-size:10px;color:var(--ink-faint);align-self:center;margin-left:4px;">בחר קטגוריה:</span>`+
      tags.map(t=>`<div class="tag" onclick="approveWithTag('${id}','${t}')">${t}</div>`).join('');
    card.appendChild(row);
  }

  // ── REJECT reason picker ──
  if(state.mode==='reject'){
    const row=document.createElement('div');
    row.className='reject-row';
    row.innerHTML=`<div class="reject-reasons">${rejectReasons.map(r=>`<div class="rtag${state.reason===r?' selected':''}" onclick="selectReason('${id}','${r}')">${r}</div>`).join('')}</div>
      <input class="reject-note" placeholder="הערה נוספת (אופציונלי)..." value="${(state.note||'').replace(/"/g,'&quot;')}" oninput="updateNote('${id}',this.value)">`;
    card.appendChild(row);
  }

  // ── ACTIONS ──
  if(state.mode!=='edit'){
    const actions=document.createElement('div');
    actions.className='actions';
    if(state.mode==='reject'){
      actions.innerHTML=`<button class="act rename" onclick="setMode('${id}','none')">ביטול</button><button class="act confirm-reject" onclick="doReject('${id}')">✕ אשר דחייה</button>`;
    } else if(state.mode==='approve'){
      actions.innerHTML=`<button class="act rename" onclick="setMode('${id}','none')">ביטול</button><button class="act rename" onclick="setMode('${id}','edit')">✎ עריכה</button><button class="act reject" onclick="setMode('${id}','reject')">✕ דחה</button>`;
    } else if(isApproved){
      actions.innerHTML=`<button class="act back" onclick="doMoveToPending('${id}')">↩ החזר</button><button class="act rename" onclick="setMode('${id}','edit')">✎ עריכה</button><button class="act reject" onclick="setMode('${id}','reject')">✕ דחה</button>`;
    } else {
      actions.innerHTML=`<button class="act approve" onclick="setMode('${id}','approve')">✓ אשר</button><button class="act rename" onclick="setMode('${id}','edit')">✎ עריכה</button><button class="act reject" onclick="setMode('${id}','reject')">✕ דחה</button>`;
    }
    card.appendChild(actions);
  }
  return card;
}

function buildRejectedItem(id,item){
  const div=document.createElement('div');
  div.className='item-card'; div.id='item-'+id;
  div.style.borderColor='rgba(185,74,58,.3)';
  const body=document.createElement('div');
  body.className='item-body';
  body.style.display='flex';body.style.alignItems='flex-start';body.style.gap='8px';
  body.innerHTML=`
    <div style="flex:1;">
      <div style="font-size:14px;color:var(--stamp-red);font-weight:600;margin-bottom:4px;">${item.text||'—'}</div>
      <div class="rej-reason">${item.reason||''}${item.note?' · '+item.note:''}</div>
      <div style="font-family:var(--font-mono);font-size:8px;color:var(--ink-faint);margin-top:3px;">${timeAgo(item.timestamp)}</div>
    </div>
    <button onclick="doMoveToPending('${id}')" style="flex-shrink:0;padding:5px 10px;background:transparent;border:1.5px solid var(--amber);border-radius:5px;color:var(--amber);font-family:var(--font-ui);font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;align-self:center;">↩ החזר</button>
  `;
  div.appendChild(body);
  return div;
}

// ── TAGS TAB ──
function renderTagsTab(){
  const list=document.getElementById('itemsList');
  const usage={};
  tags.forEach(t=>usage[t]=0);
  Object.values(allData.approved).forEach(item=>{ if(item.tag&&usage[item.tag]!==undefined)usage[item.tag]++; });

  function buildSection(title,list_,type,isExpanded){
    const isReject=type==='reject';
    const countLabel=`${list_.length} פריטים`;
    let html=`<div class="tags-section">
      <div class="tags-section-header" onclick="toggleSection('${type}')">
        <span class="tags-section-toggle">${isExpanded?'▼':'◀'}</span>
        <span class="tags-section-title">${title}</span>
        <span class="tags-section-meta">${countLabel}</span>
      </div>
      <div class="tags-section-body${isExpanded?'':' collapsed'}" id="section-body-${type}">`;

    list_.forEach((name,idx)=>{
      const isRenaming=renamingTag&&renamingTag.type===type&&renamingTag.idx===idx;
      const count=isReject?0:(usage[name]||0);
      const canDelete=count===0;
      if(isRenaming){
        html+=`<div class="tag-rename-row">
          <input class="tag-rename-input" id="renameInput-${type}-${idx}" value="${name.replace(/"/g,'&quot;')}" oninput="updateRenameTag('${type}',${idx},this.value)">
          <button class="tag-rename-save" onclick="saveRenameTag('${type}',${idx})">שמור</button>
          <button class="tag-rename-cancel" onclick="cancelRenameTag()">ביטול</button>
        </div>`;
      } else {
        html+=`<div class="tag-mgmt-item">
          <span class="tag-mgmt-name">${name}</span>
          ${!isReject?`<span class="tag-mgmt-count">${count} פריטים</span>`:''}
          <button class="tag-mgmt-btn ren" onclick="startRenameTag('${type}',${idx})" title="שנה שם">✎</button>
          ${canDelete
            ?`<button class="tag-mgmt-btn del" onclick="deleteTagItem('${type}',${idx})" title="מחק">✕</button>`
            :`<button class="tag-mgmt-btn del" style="opacity:.25;cursor:default;" title="בשימוש">✕</button>`}
        </div>`;
      }
    });

    const inputId=`newTagInput-${type}`, btnId=`addTagBtn-${type}`;
    html+=`<div class="tag-add-row">
      <input class="tag-add-input" id="${inputId}" placeholder="הוסף ${isReject?'סיבת דחייה':'קטגוריה'} חדשה..." oninput="document.getElementById('${btnId}').disabled=!this.value.trim()">
      <button class="tag-add-btn" id="${btnId}" disabled onclick="addTagItem('${type}')">הוסף ›</button>
    </div>`;
    html+=`</div></div>`;
    return html;
  }

  list.innerHTML=`<div class="tags-body">
    ${buildSection('קטגוריות אישור',tags,'tags',tagsSectionState.approve)}
    ${buildSection('סיבות דחייה',rejectReasons,'reject',tagsSectionState.reject)}
  </div>`;
}

window.toggleSection=function(type){
  tagsSectionState[type===('tags')?'approve':'reject']=!tagsSectionState[type===('tags')?'approve':'reject'];
  renderTagsTab();
};

window.startRenameTag=function(type,idx){
  renamingTag={type,idx,val:(type==='tags'?tags:rejectReasons)[idx]};
  renderTagsTab();
  const input=document.getElementById(`renameInput-${type}-${idx}`);
  if(input){input.focus();input.select();}
};
window.updateRenameTag=function(type,idx,val){ if(renamingTag)renamingTag.val=val; };
window.cancelRenameTag=function(){ renamingTag=null; renderTagsTab(); };
window.saveRenameTag=async function(type,idx){
  const newName=(renamingTag?.val||'').trim();
  if(!newName)return;
  const list_=type==='tags'?tags:rejectReasons;
  const old=list_[idx];
  if(newName===old){renamingTag=null;renderTagsTab();return;}
  list_[idx]=newName;
  // Update any approved items using old tag
  if(type==='tags'){
    for(const [id,item] of Object.entries(allData.approved)){
      if(item.tag===old){ await set(ref(db,'community/approved/'+id),{...item,tag:newName}); allData.approved[id]={...item,tag:newName}; }
    }
  }
  // Reset filter if it was pointing to the renamed tag
  if(activeFilter===old) activeFilter='הכל';
  try{
    await set(ref(db,'community/'+(type==='tags'?'tags':'rejectReasons')),list_);
    renamingTag=null; renderTagsTab();
  }catch(e){ alert('שגיאה: '+e.message); list_[idx]=old; }
};

window.addTagItem=async function(type){
  const input=document.getElementById(`newTagInput-${type}`);
  const name=(input?.value||'').trim();
  const list_=type==='tags'?tags:rejectReasons;
  if(!name||list_.includes(name))return;
  list_.push(name);
  try{
    await set(ref(db,'community/'+(type==='tags'?'tags':'rejectReasons')),list_);
    renderTagsTab();
  }catch(e){ alert('שגיאה: '+e.message); list_.pop(); }
};

window.deleteTagItem=async function(type,idx){
  const list_=type==='tags'?tags:rejectReasons;
  const removed=list_.splice(idx,1)[0];
  try{
    await set(ref(db,'community/'+(type==='tags'?'tags':'rejectReasons')),list_);
    renderTagsTab();
  }catch(e){ alert('שגיאה: '+e.message); list_.splice(idx,0,removed); }
};

// ── ITEM ACTIONS ──
window.setMode=function(id,mode){
  const state=getState(id);
  const src=allData[currentTab][id]||{};
  state.mode=state.mode===mode?'none':mode;
  if(mode==='edit'){state.editVal=src.text||'';state.editTag=src.tag||'';}
  rerenderItem(id);
};
window.updateEdit=function(id,val){getState(id).editVal=val;};
window.selectEditTag=function(id,tag){const s=getState(id);s.editTag=s.editTag===tag?'':tag;rerenderItem(id);};
window.updateNote=function(id,val){getState(id).note=val;};
window.selectReason=function(id,r){const s=getState(id);s.reason=s.reason===r?'':r;rerenderItem(id);};

window.approveWithTag=async function(id,tag){
  const item=allData.pending[id]||{};
  const state=getState(id);
  const text=state.editVal?.trim()||item.text;
  try{
    await set(ref(db,'community/approved/'+id),{text,tag,timestamp:Date.now(),originalText:item.text,deviceId:item.deviceId});
    await remove(ref(db,'community/pending/'+id));
    delete allData.pending[id]; allData.approved[id]={text,tag,timestamp:Date.now(),deviceId:item.deviceId};
    delete itemStates[id]; activeFilter='הכל'; updateHeader(); renderItems();
  }catch(e){alert('שגיאה: '+e.message);}
};

window.saveEdit=async function(id){
  const item=allData[currentTab][id]||{};
  const state=getState(id);
  const text=(state.editVal||'').trim()||item.text;
  const updatedItem={...item, text};
  // Only include tag if it's defined (pending items from rejected have no tag)
  if(state.editTag) updatedItem.tag=state.editTag;
  else if(item.tag) updatedItem.tag=item.tag;
  // Remove undefined values
  Object.keys(updatedItem).forEach(k=>updatedItem[k]===undefined&&delete updatedItem[k]);
  try{
    await set(ref(db,'community/'+currentTab+'/'+id),updatedItem);
    allData[currentTab][id]=updatedItem;
    delete itemStates[id]; activeFilter='הכל'; renderItems();
  }catch(e){alert('שגיאה: '+e.message);}
};

window.doReject=async function(id){
  const item=allData[currentTab][id]||{};
  const state=getState(id);
  try{
    await set(ref(db,'community/rejected/'+id),{text:item.text,reason:state.reason||'',note:state.note||'',timestamp:Date.now(),deviceId:item.deviceId});
    await remove(ref(db,'community/'+currentTab+'/'+id));
    delete allData[currentTab][id]; allData.rejected[id]={text:item.text,reason:state.reason||'',note:state.note||'',timestamp:Date.now()};
    delete itemStates[id]; updateHeader(); renderItems();
  }catch(e){alert('שגיאה: '+e.message);}
};

window.doMoveToPending=async function(id){
  const item=allData[currentTab][id]||{};
  try{
    await set(ref(db,'community/pending/'+id),{text:item.text,timestamp:item.timestamp||Date.now(),deviceId:item.deviceId||''});
    await remove(ref(db,'community/'+currentTab+'/'+id));
    delete allData[currentTab][id]; allData.pending[id]={text:item.text,timestamp:item.timestamp||Date.now(),deviceId:item.deviceId||''};
    delete itemStates[id]; updateHeader(); renderItems();
  }catch(e){alert('שגיאה: '+e.message);}
};

function rerenderItem(id){
  const card=document.getElementById('item-'+id);
  if(card) card.replaceWith(buildItem(id,allData[currentTab][id]));
}

loadAll();
</script>
</body>
</html>
