<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AirCheck+ · Tower</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4ecdc;--paper-hi:#fbf6e8;--paper-edge:#e3d4ad;
  --ink:#1c3d6e;--ink-muted:#5a4a3a;--ink-faint:#8a7a5a;
  --gold:#c8a04a;--gold-lite:#d4b878;
  --cleared:#1f6f3f;--stamp-red:#b94a3a;--amber:#f59e0b;
  --font-ui:'IBM Plex Sans Hebrew',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:#1a1a1c;font-family:var(--font-ui);color:var(--ink);}
body{display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;}

.card{
  background:var(--paper);
  background-image:repeating-linear-gradient(0deg,transparent 0,transparent 27px,rgba(28,61,110,.055) 27px,rgba(28,61,110,.055) 28px);
  border:2px solid var(--gold);border-radius:8px;
  width:100%;max-width:420px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

/* header */
.header{background:var(--ink);padding:16px 18px 14px;}
.header-title{font-size:18px;font-weight:700;color:#f4ecdc;direction:rtl;}
.header-station{font-size:11px;color:rgba(244,236,220,.55);margin-top:3px;direction:rtl;}

/* body */
.body{padding:16px 18px;}

/* live status panel — read-only echo of what's currently posted.
   Color carries age: green (fresh) -> amber (aging) -> gray (stale).
   Text stays mono + faded at every stage so it never reads as editable. */
.live-panel{
  position:relative;padding:14px 14px 13px;border-radius:6px;border:1.5px solid var(--gold-lite);
  margin-bottom:18px;transition:border-color .2s,background .2s;
  display:none;
}
.live-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.live-head-right{display:flex;align-items:center;gap:7px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--gold-lite);transition:background .2s;}
.live-label{font-size:11px;font-weight:600;color:var(--ink);letter-spacing:.01em;}
.live-age-group{display:flex;align-items:center;gap:5px;}
.live-hourglass{font-size:12px;line-height:1;opacity:0;transition:opacity .15s linear;}
.live-hourglass.blink{animation:live-hg-blink 1.1s ease-in-out infinite;}
@keyframes live-hg-blink{0%,100%{opacity:1;}50%{opacity:.25;}}
.live-age{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-faint);letter-spacing:.04em;direction:ltr;}

.decay-bar-track{width:100%;height:3px;border-radius:2px;background:rgba(0,0,0,.07);margin:10px 0 11px;overflow:hidden;}
.decay-bar-fill{height:100%;border-radius:2px;width:100%;background:var(--gold-lite);transition:width .2s linear,background .2s linear;}

.live-text{
  font-family:var(--font-mono);font-size:12px;line-height:1.75;color:var(--ink-faint);
  direction:rtl;white-space:pre-wrap;letter-spacing:.01em;
  max-height:96px;overflow-y:auto;scrollbar-width:none;
}
.live-text::-webkit-scrollbar{display:none;}
.live-meta{
  margin-top:9px;padding-top:9px;border-top:1px dashed var(--paper-edge);
  font-family:var(--font-mono);font-size:8.5px;color:var(--ink-faint);
  letter-spacing:.06em;direction:ltr;text-align:left;
}

.compose-label{font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:8px;direction:rtl;}

textarea{
  width:100%;min-height:160px;padding:12px;
  background:var(--paper-hi);border:1.5px solid var(--gold-lite);border-radius:4px;
  font-family:var(--font-ui);font-size:14px;line-height:1.6;color:var(--ink);
  resize:vertical;outline:none;direction:rtl;
  transition:border-color .15s;
}
textarea:focus{border-color:var(--ink);}
textarea::placeholder{color:rgba(28,61,110,.3);}

.char-count{font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);text-align:left;margin-top:4px;letter-spacing:.06em;}

.submit-btn{
  width:100%;padding:14px;margin-top:12px;
  background:var(--ink);border:none;border-radius:6px;
  color:#f4ecdc;font-family:var(--font-ui);font-size:15px;font-weight:700;
  cursor:pointer;transition:background .25s,opacity .15s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.submit-btn:active{opacity:.8;}
.submit-btn:disabled{opacity:.35;cursor:default;}
.submit-btn.sending{background:#3a5a8a;opacity:1;}
.submit-btn.sent{background:var(--cleared);opacity:1;}
.btn-spinner{width:13px;height:13px;border-radius:50%;border:2px solid rgba(244,236,220,.3);border-top-color:#f4ecdc;animation:btn-spin .7s linear infinite;}
@keyframes btn-spin{to{transform:rotate(360deg);}}

.status{
  padding:10px 12px;border-radius:4px;
  font-size:13px;line-height:1.5;direction:rtl;
  display:none;margin-top:10px;
}
.status.success{background:rgba(31,111,63,.1);border:1px solid rgba(31,111,63,.3);color:var(--cleared);}
.status.error{background:rgba(185,74,58,.08);border:1px solid rgba(185,74,58,.25);color:var(--stamp-red);}
.status.show{display:block;}

.footer{padding:10px 14px;border-top:1px solid var(--gold-lite);text-align:center;}
.footer-txt{font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);letter-spacing:.1em;text-transform:uppercase;}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="header-title">עדכון מצב שדה</div>
    <div class="header-station" id="headerStation">טוען...</div>
  </div>

  <div class="body">
    <div class="live-panel" id="livePanel">
      <div class="live-head">
        <div class="live-head-right">
          <div class="live-dot" id="liveDot"></div>
          <div class="live-label">מה ששלחת לטייסים</div>
        </div>
        <div class="live-age-group">
          <div class="live-hourglass" id="liveHourglass">⏳</div>
          <div class="live-age" id="lastUpdateTime">—</div>
        </div>
      </div>
      <div class="decay-bar-track"><div class="decay-bar-fill" id="liveBarFill"></div></div>
      <div class="live-text" id="lastUpdateText">—</div>
      <div class="live-meta" id="liveMetaDate">—</div>
    </div>

    <div class="compose-label">עדכון חדש</div>
    <textarea id="msgInput" placeholder="הדבק כאן את הודעת מצב השדה מה-WhatsApp..." oninput="onInput()"></textarea>
    <div class="char-count" id="charCount">0 תווים</div>
    <div class="status" id="statusMsg"></div>
    <button class="submit-btn" id="submitBtn" onclick="submitUpdate()" disabled>שלח עדכון ›</button>
  </div>

  <div class="footer" dir="ltr">
    <div class="footer-txt" id="footerTxt">AirCheck+ · Tower · v1.10 · built by eligrt</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBoW1O9dTanLUZW5Z8jswn3hxpfFSdmzm0",
  authDomain: "aircheck-80530.firebaseapp.com",
  databaseURL: "https://aircheck-80530-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "aircheck-80530",
  storageBucket: "aircheck-80530.firebasestorage.app",
  messagingSenderId: "816746630548",
  appId: "1:816746630548:web:dac8392deff9b96cc9d381"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const params = new URLSearchParams(window.location.search);
const icao = (params.get('icao') || 'LLHZ').toUpperCase();

const stationNames = {
  LLHZ: 'הרצליה · Herzliya',
  LLBG: 'נתב״ג · Ben Gurion',
  LLIB: 'ראש פינה · Rosh Pina',
  LLHA: 'חיפה · Haifa',
  LLER: 'רמון · Ramon'
};

function init(){
  document.getElementById('headerStation').textContent = (stationNames[icao]||icao) + ' · ' + icao;
  document.getElementById('footerTxt').textContent = 'AirCheck+ · Tower · v1.10 · built by eligrt';
  loadLastUpdate();
}

let _lastTimestamp = null;

async function loadLastUpdate(){
  try{
    const snap = await get(ref(db, 'tower/' + icao + '/latest'));
    const data = snap.val();
    if(data){
      _lastTimestamp = data.timestamp;
      document.getElementById('livePanel').style.display = '';
      document.getElementById('lastUpdateText').textContent = data.text || '—';
      const d = new Date(data.timestamp);
      const h = String(d.getUTCHours()).padStart(2,'0');
      const m = String(d.getUTCMinutes()).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      const mo = String(d.getMonth()+1).padStart(2,'0');
      document.getElementById('liveMetaDate').textContent = 'POSTED · ' + day+'/'+mo+' '+h+':'+m+'Z';
      renderLivePanelDecay();
    }
  }catch(e){}
}

// Color carries age: green (fresh, <3h) -> amber (aging, 3-9h) -> gray (stale, 9h+).
// Deliberately distinct from עדכוני שדה's alert palette — this screen is a self-check
// for the tower operator ("is my own post still relevant"), not a pilot-facing alert.
const LIVE_GREEN={r:31,g:111,b:63}, LIVE_AMBER={r:245,g:158,b:11}, LIVE_GRAY={r:138,g:122,b:90};
function liveLerp(a,b,t){return Math.round(a+(b-a)*t);}
function liveMix(c1,c2,t){return 'rgb('+liveLerp(c1.r,c2.r,t)+','+liveLerp(c1.g,c2.g,t)+','+liveLerp(c1.b,c2.b,t)+')';}

function renderLivePanelDecay(){
  if(_lastTimestamp == null) return;
  const hours = (Date.now() - _lastTimestamp) / 3600000;

  let col;
  if(hours<3){ col=liveMix(LIVE_GREEN,LIVE_AMBER,hours/3); }
  else if(hours<9){ col='rgb('+LIVE_AMBER.r+','+LIVE_AMBER.g+','+LIVE_AMBER.b+')'; }
  else { col=liveMix(LIVE_AMBER,LIVE_GRAY,Math.min(1,(hours-9)/3)); }

  const panel=document.getElementById('livePanel');
  panel.style.borderColor=col;
  panel.style.background=col.replace('rgb','rgba').replace(')',',.06)');
  document.getElementById('liveDot').style.background=col;
  const fill=document.getElementById('liveBarFill');
  fill.style.background=col;
  fill.style.width=Math.max(0,100-(hours/12*100))+'%';

  // age label
  const diffMin=Math.round((Date.now()-_lastTimestamp)/60000);
  document.getElementById('lastUpdateTime').textContent = diffMin<60 ? 'לפני '+diffMin+' דק׳' : 'לפני '+Math.round(hours)+' שע׳';

  // hourglass: invisible through most of green, fades in late-green (2.4h-3h),
  // static through amber (3h-9h), blinking once gray (9h+)
  const FADE_START=2.4, GREEN_END=3;
  const hg=document.getElementById('liveHourglass');
  if(hours<FADE_START){
    hg.style.opacity=0; hg.classList.remove('blink');
  } else if(hours<GREEN_END){
    hg.style.opacity=(hours-FADE_START)/(GREEN_END-FADE_START); hg.classList.remove('blink');
  } else if(hours<9){
    hg.style.opacity=1; hg.classList.remove('blink');
  } else {
    hg.style.opacity=1; hg.classList.add('blink');
  }
}
setInterval(renderLivePanelDecay, 60000);

window.onInput = function(){
  const val = document.getElementById('msgInput').value;
  document.getElementById('charCount').textContent = val.length + ' תווים';
  document.getElementById('submitBtn').disabled = val.trim().length < 5;
};

window.submitUpdate = async function(){
  const text = document.getElementById('msgInput').value.trim();
  if(!text) return;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.classList.add('sending');
  btn.innerHTML = '<span class="btn-spinner"></span> שולח לטייסים...';
  try{
    const now = Date.now();
    await set(ref(db, 'tower/' + icao + '/latest'), { text, timestamp: now, icao });
    await set(ref(db, 'tower/' + icao + '/history/' + now), { text, timestamp: now, icao });
    document.getElementById('msgInput').value = '';
    document.getElementById('charCount').textContent = '0 תווים';
    btn.classList.remove('sending');
    btn.classList.add('sent');
    btn.innerHTML = '<span>✓</span> עודכן — מוצג לטייסים';
    loadLastUpdate();
    setTimeout(() => {
      btn.classList.remove('sent');
      btn.textContent = 'שלח עדכון ›';
      btn.disabled = true;
    }, 1800);
  }catch(e){
    btn.classList.remove('sending');
    btn.textContent = 'שלח עדכון ›';
    btn.disabled = false;
    showStatus('error', 'שגיאה בשליחה. בדוק חיבור לאינטרנט.');
  }
};

function showStatus(type, msg){
  const el = document.getElementById('statusMsg');
  el.className = 'status ' + type + ' show';
  el.textContent = msg;
  setTimeout(() => el.classList.remove('show'), 4000);
}

init();
</script>
</body>
</html>
