<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AirCheck+ · Tower</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4ecdc;--paper-hi:#fbf6e8;--paper-edge:#e3d4ad;
  --ink:#1c3d6e;--ink-muted:#5a4a3a;--ink-faint:#8a7a5a;
  --gold:#c8a04a;--gold-lite:#d4b878;
  --cleared:#1f6f3f;--stamp-red:#b94a3a;--amber:#f59e0b;
  --font-ui:'IBM Plex Sans Hebrew',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:#1a1a1c;font-family:var(--font-ui);color:var(--ink);}
body{display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;}

.card{
  background:var(--paper);
  background-image:repeating-linear-gradient(0deg,transparent 0,transparent 27px,rgba(28,61,110,.055) 27px,rgba(28,61,110,.055) 28px);
  border:2px solid var(--gold);border-radius:8px;
  width:100%;max-width:420px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  display:flex;flex-direction:column;
  height:calc(100vh - 48px);max-height:760px;
}

/* header — plain navy, real splash wordmark treatment on top */
.header{background:var(--ink);padding:18px 18px 14px;flex-shrink:0;}
.fam-wordmark-row{display:flex;align-items:baseline;gap:8px;direction:ltr;}
.fam-wordmark-main{font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--paper);letter-spacing:-.5px;}
.fam-sub{font-size:14px;font-weight:600;color:rgba(244,236,220,.8);font-family:var(--font-mono);}
.fam-tagline{font-size:10.5px;color:rgba(244,236,220,.62);letter-spacing:.03em;font-family:var(--font-mono);font-style:italic;margin-top:5px;direction:ltr;unicode-bidi:bidi-override;}
.header-title{font-size:18px;font-weight:700;color:#f4ecdc;direction:rtl;margin-top:14px;}
.header-station{font-size:13.5px;font-weight:600;color:rgba(244,236,220,.85);margin-top:4px;direction:rtl;}

/* body fills remaining height; box-stack holds the two symmetric boxes */
.body{padding:16px 18px;flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;}
.box-stack{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:14px;}

/* live status panel — read-only echo of what's currently posted.
   Color carries age: green (fresh) -> amber (aging) -> gray (stale).
   Text stays mono + faded at every stage so it never reads as editable.
   Symmetric with compose-box: each gets an equal, fixed share of the
   available height (flex:1 1 0) — content scrolls inside, box never grows. */
.live-panel{
  position:relative;padding:13px 14px 12px;border-radius:6px;border:1.5px solid var(--gold-lite);
  background:var(--paper-hi);
  transition:border-color .2s,background .2s;
  display:flex;flex:1 1 0;min-height:0;flex-direction:column;
}
.live-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-shrink:0;}
.live-head-right{display:flex;align-items:center;gap:7px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--gold-lite);transition:background .2s;}
.live-label{font-size:11px;font-weight:600;color:var(--ink);letter-spacing:.01em;}

.live-text{
  font-family:var(--font-ui);font-size:12.5px;line-height:1.7;color:var(--ink-faint);
  direction:rtl;white-space:pre-wrap;letter-spacing:.005em;
  flex:1;overflow-y:auto;min-height:0;scrollbar-width:none;
}
.live-text::-webkit-scrollbar{display:none;}

.live-meta-row{
  margin-top:8px;padding-top:8px;border-top:1px dashed var(--paper-edge);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
/* Hebrew portion (relative age) uses the UI font — JetBrains Mono has no
   Hebrew glyphs and silently falls back to a mismatched system font.
   The posted date/time is pure Latin+digits, so mono is correct there. */
.live-meta-text{font-size:9px;color:var(--ink-faint);letter-spacing:.03em;direction:ltr;}
.live-meta-text #lastUpdateTime{font-family:var(--font-ui);}
.live-meta-text #liveMetaDate{font-family:var(--font-mono);letter-spacing:.06em;}

.lives-row{display:flex;gap:3px;align-items:center;}
.lives-row .life{width:13px;height:13px;opacity:.18;transition:opacity .15s linear;color:var(--ink-faint);}
.lives-row .life svg{width:100%;height:100%;display:block;}
.lives-row .life.lit{opacity:1;}
.lives-row .life.blink{animation:live-life-blink 1.1s ease-in-out infinite;}
@keyframes live-life-blink{0%,100%{opacity:1;}50%{opacity:.2;}}

/* compose box — symmetric twin of live-panel */
.compose-box{
  flex:1 1 0;min-height:0;display:flex;flex-direction:column;
  border-radius:6px;border:1.5px solid var(--gold-lite);
  padding:13px 14px 12px;background:var(--paper-hi);
}
.compose-label{font-size:11px;font-weight:600;color:var(--ink-muted);margin-bottom:8px;direction:rtl;flex-shrink:0;}

textarea{
  width:100%;flex:1;min-height:0;padding:0;border:none;outline:none;
  background:transparent;
  font-family:var(--font-ui);font-size:14px;line-height:1.6;color:var(--ink);
  resize:none;direction:rtl;overflow-y:auto;
}
textarea::placeholder{color:rgba(28,61,110,.3);}

.char-count{font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);text-align:left;margin-top:6px;letter-spacing:.06em;flex-shrink:0;}

.submit-btn{
  width:100%;padding:14px;margin-top:12px;flex-shrink:0;
  background:var(--ink);border:none;border-radius:6px;
  color:#f4ecdc;font-family:var(--font-ui);font-size:15px;font-weight:700;
  cursor:pointer;transition:background .25s,opacity .15s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.submit-btn:active{opacity:.8;}
.submit-btn:disabled{opacity:.35;cursor:default;}
.submit-btn.sending{background:#3a5a8a;opacity:1;}
.submit-btn.sent{background:var(--cleared);opacity:1;}
.btn-spinner{width:13px;height:13px;border-radius:50%;border:2px solid rgba(244,236,220,.3);border-top-color:#f4ecdc;animation:btn-spin .7s linear infinite;}
@keyframes btn-spin{to{transform:rotate(360deg);}}

.stuck-hint{
  text-align:center;margin-top:8px;font-size:11.5px;color:var(--ink-muted);
  opacity:0;max-height:0;overflow:hidden;transition:opacity .4s ease,max-height .4s ease;
}
.stuck-hint.show{opacity:1;max-height:30px;}
.stuck-hint a{color:var(--ink);font-weight:700;text-decoration:underline;cursor:pointer;}

.status{
  padding:10px 12px;border-radius:4px;
  font-size:13px;line-height:1.5;direction:rtl;
  display:none;margin-top:10px;
}
.status.success{background:rgba(31,111,63,.1);border:1px solid rgba(31,111,63,.3);color:var(--cleared);}
.status.error{background:rgba(185,74,58,.08);border:1px solid rgba(185,74,58,.25);color:var(--stamp-red);}
.status.show{display:block;}

.footer{padding:10px 14px;border-top:1px solid var(--gold-lite);text-align:center;flex-shrink:0;}
.footer-txt{font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);letter-spacing:.1em;text-transform:uppercase;}

/* app-themed scrollbars — replaces default OS scrollbar wherever content scrolls */
.body,.history-list{
  scrollbar-width:thin;scrollbar-color:var(--gold-lite) transparent;
  scrollbar-gutter:stable;
}
.body::-webkit-scrollbar,.history-list::-webkit-scrollbar{width:6px;}
.body::-webkit-scrollbar-track,.history-list::-webkit-scrollbar-track{background:transparent;}
.body::-webkit-scrollbar-thumb,.history-list::-webkit-scrollbar-thumb{
  background:var(--gold-lite);border-radius:3px;
}
.body::-webkit-scrollbar-thumb:hover,.history-list::-webkit-scrollbar-thumb:hover{background:var(--gold);}

/* sender-only history (not pilot-facing) */
.history-toggle{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;border-radius:6px;border:1.5px solid var(--paper-edge);
  background:rgba(28,61,110,.03);cursor:pointer;margin-top:12px;flex-shrink:0;
  transition:background .15s;
}
.history-toggle:active{background:rgba(28,61,110,.07);}
.history-toggle-left{display:flex;align-items:center;gap:8px;}
.history-icon{width:15px;height:15px;color:var(--ink-faint);flex-shrink:0;}
.history-icon svg{width:100%;height:100%;display:block;}
.history-toggle-text{font-size:12px;font-weight:600;color:var(--ink-muted);}
.history-count-badge{
  font-family:var(--font-mono);font-size:9.5px;color:var(--ink-faint);
  background:var(--paper-edge);padding:1px 6px;border-radius:8px;margin-right:6px;
}
.history-toggle-right{display:flex;align-items:center;}
.history-state-word{
  font-size:10px;font-weight:600;color:var(--ink-faint);
  margin-right:6px;padding-right:6px;border-right:1px dashed var(--paper-edge);
}
.history-chevron{width:11px;height:11px;color:var(--ink-faint);transition:transform .2s;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.history-chevron.open{transform:rotate(180deg);}

.history-panel{overflow:hidden;max-height:0;transition:max-height .25s ease;flex-shrink:0;}
.history-panel.open{max-height:340px;}
.history-list{
  border:1.5px solid var(--paper-edge);border-top:none;border-radius:0 0 6px 6px;
  background:var(--paper-hi);padding:6px 0;max-height:340px;overflow-y:auto;
}
.history-item{
  padding:9px 14px;border-bottom:1px dashed var(--paper-edge);
  display:flex;flex-direction:column;gap:3px;cursor:pointer;
}
.history-item:last-child{border-bottom:none;}
.history-item-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.history-item-time{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-faint);letter-spacing:.04em;direction:ltr;flex-shrink:0;}
.history-item-relative{font-size:10px;color:var(--ink-faint);}
.history-item-text{
  font-size:12px;line-height:1.5;color:var(--ink);direction:rtl;white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
}
.history-item.itemopen .history-item-text{-webkit-line-clamp:unset;overflow:visible;}
.history-item-more{font-size:9.5px;color:var(--ink-faint);margin-top:1px;direction:rtl;}
.history-item.itemopen .history-item-more{display:none;}
.history-item.flagged{background:rgba(185,74,58,.05);}
.history-item.flagged .history-item-time{color:var(--stamp-red);}
.flag-pill{
  font-size:8.5px;font-weight:700;color:var(--stamp-red);
  background:rgba(185,74,58,.12);padding:1px 5px;border-radius:4px;letter-spacing:.03em;flex-shrink:0;
}
.history-empty{padding:18px 14px;text-align:center;font-size:11.5px;color:var(--ink-faint);}
.history-loading{padding:18px 14px;text-align:center;font-size:11px;color:var(--ink-faint);}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="fam-wordmark-row"><span class="fam-wordmark-main">AirCheck+</span><span class="fam-sub">· Tower</span></div>
    <div class="fam-tagline">"the checklist on top of the checklist"</div>
    <div class="header-title">עדכוני מגדל למצב שדה</div>
    <div class="header-station" id="headerStation">טוען...</div>
  </div>

  <div class="body">
    <div class="box-stack">
      <div class="live-panel" id="livePanel">
        <div class="live-head">
          <div class="live-head-right">
            <div class="live-dot" id="liveDot"></div>
            <div class="live-label">העדכון האחרון שנשלח לטייסים:</div>
          </div>
        </div>
        <div class="live-text" id="lastUpdateText">טוען...</div>
        <div class="live-meta-row" id="liveMetaRow" style="display:none;">
          <div class="lives-row" id="livesRow"></div>
          <div class="live-meta-text"><span id="lastUpdateTime">—</span> · <span id="liveMetaDate">—</span></div>
        </div>
      </div>

      <div class="compose-box">
        <div class="compose-label">עדכון חדש</div>
        <textarea id="msgInput" placeholder="הדבק כאן את הודעת מצב השדה מה-WhatsApp..." oninput="onInput()"></textarea>
      </div>
    </div>

    <div class="char-count" id="charCount">0 תווים</div>
    <div class="status" id="statusMsg"></div>
    <button class="submit-btn" id="submitBtn" onclick="submitUpdate()" disabled>שלח עדכון ›</button>
    <div class="stuck-hint" id="stuckHint">מממ... זמן השליחה ארוך מהרגיל 🤔 <a onclick="resetStuckSend()">תרצה לנסות שוב?</a></div>

    <div class="history-toggle" id="historyToggle" onclick="toggleHistory()">
      <div class="history-toggle-left">
        <div class="history-icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 8v4l3 2M21 12a9 9 0 1 1-9-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="history-toggle-text">היסטוריית עדכונים שלי</div>
        <span class="history-count-badge" id="historyCount">—</span>
      </div>
      <div class="history-toggle-right">
        <span class="history-state-word" id="historyStateWord">הצג</span>
        <div class="history-chevron" id="historyChevron"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
    </div>
    <div class="history-panel" id="historyPanel">
      <div class="history-list" id="historyList">
        <div class="history-loading">טוען...</div>
      </div>
    </div>
  </div>

  <div class="footer" dir="ltr">
    <div class="footer-txt" id="footerTxt">AirCheck+ · Tower · v1.31 · built by eligrt</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBoW1O9dTanLUZW5Z8jswn3hxpfFSdmzm0",
  authDomain: "aircheck-80530.firebaseapp.com",
  databaseURL: "https://aircheck-80530-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "aircheck-80530",
  storageBucket: "aircheck-80530.firebasestorage.app",
  messagingSenderId: "816746630548",
  appId: "1:816746630548:web:dac8392deff9b96cc9d381"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const params = new URLSearchParams(window.location.search);
const icao = (params.get('icao') || 'LLHZ').toUpperCase();

const stationNames = {
  LLHZ: 'הרצליה · Herzliya',
  LLBG: 'נתב״ג · Ben Gurion',
  LLIB: 'ראש פינה · Rosh Pina',
  LLHA: 'חיפה · Haifa',
  LLER: 'רמון · Ramon'
};

function init(){
  document.getElementById('headerStation').textContent = (stationNames[icao]||icao) + ' · ' + icao;
  document.getElementById('footerTxt').textContent = 'AirCheck+ · Tower · v1.31 · built by eligrt';
  buildLivesRow();
  loadLastUpdate();
  lockBoxStackHeight();
}

// Measures the live-panel+compose-box pair at their natural "fill the
// screen" size (while history is still closed) and locks that exact
// pixel height permanently. This keeps the closed/default state visually
// identical to before, while guaranteeing the boxes never resize again
// once the history panel is opened/closed — only the page scrolls.
function lockBoxStackHeight(){
  requestAnimationFrame(() => {
    const stack = document.querySelector('.box-stack');
    stack.style.flex = '1 1 auto'; // unlock to measure true natural size
    requestAnimationFrame(() => {
      const h = stack.getBoundingClientRect().height;
      stack.style.flex = '0 0 ' + h + 'px';
    });
  });
}
window.addEventListener('resize', () => {
  if(!document.getElementById('historyPanel').classList.contains('open')){
    lockBoxStackHeight();
  }
});

const HOURGLASS_SVG='<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 2h12M6 22h12M6 2c0 5 5 6 6 8 1-2 6-3 6-8M6 22c0-5 5-6 6-8 1 2 6 3 6 8" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
function buildLivesRow(){
  const row=document.getElementById('livesRow');
  row.innerHTML='';
  for(let i=0;i<5;i++){
    const s=document.createElement('span');
    s.className='life';
    s.innerHTML=HOURGLASS_SVG;
    row.appendChild(s);
  }
}

let _lastTimestamp = null;

async function loadLastUpdate(){
  const panel = document.getElementById('livePanel');
  const textEl = document.getElementById('lastUpdateText');
  const metaRow = document.getElementById('liveMetaRow');
  try{
    const snap = await get(ref(db, 'tower/' + icao + '/latest'));
    const data = snap.val();
    if(data){
      _lastTimestamp = data.timestamp;
      textEl.textContent = data.text || '—';
      const d = new Date(data.timestamp);
      const h = String(d.getUTCHours()).padStart(2,'0');
      const m = String(d.getUTCMinutes()).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      const mo = String(d.getMonth()+1).padStart(2,'0');
      document.getElementById('liveMetaDate').textContent = 'POSTED ' + day+'/'+mo+' '+h+':'+m+'Z';
      metaRow.style.display = '';
      renderLivePanelDecay();
    } else {
      // fetch succeeded, but this station has never posted — not an error
      _lastTimestamp = null;
      panel.style.borderColor = '';
      panel.style.background = '';
      document.getElementById('liveDot').style.background = 'var(--gold-lite)';
      textEl.textContent = 'טרם נשלח עדכון לטייסים בתחנה זו';
      metaRow.style.display = 'none';
    }
  }catch(e){
    _lastTimestamp = null;
    panel.style.borderColor = '';
    panel.style.background = '';
    document.getElementById('liveDot').style.background = 'var(--gold-lite)';
    textEl.textContent = 'לא ניתן לטעון את העדכון הקודם. בדוק חיבור לאינטרנט.';
    metaRow.style.display = 'none';
  }
}

// Color carries age: green (fresh, <3h) -> amber (aging, 3-9h) -> gray (stale, 9h+).
// Deliberately distinct from עדכוני שדה's alert palette — this screen is a self-check
// for the tower operator ("is my own post still relevant"), not a pilot-facing alert.
// Border gray is intentionally lighter than the body-text gray so it doesn't read as black.
const LIVE_GREEN={r:31,g:111,b:63}, LIVE_AMBER={r:245,g:158,b:11}, LIVE_GRAY={r:168,g:158,b:138}, LIVE_RED={r:185,g:74,b:58};
const LIVE_PAPER_HI={r:251,g:246,b:232};
function liveLerp(a,b,t){return Math.round(a+(b-a)*t);}
function liveMix(c1,c2,t){return 'rgb('+liveLerp(c1.r,c2.r,t)+','+liveLerp(c1.g,c2.g,t)+','+liveLerp(c1.b,c2.b,t)+')';}
function liveMixObj(c1,c2,t){return {r:liveLerp(c1.r,c2.r,t),g:liveLerp(c1.g,c2.g,t),b:liveLerp(c1.b,c2.b,t)};}

function renderLivePanelDecay(){
  if(_lastTimestamp == null) return;
  const hours = (Date.now() - _lastTimestamp) / 3600000;

  let colObj;
  if(hours<3){ colObj=liveMixObj(LIVE_GREEN,LIVE_AMBER,hours/3); }
  else if(hours<9){ colObj=LIVE_AMBER; }
  else { colObj=liveMixObj(LIVE_AMBER,LIVE_GRAY,Math.min(1,(hours-9)/3)); }
  const col='rgb('+colObj.r+','+colObj.g+','+colObj.b+')';

  // Solid fill: blend the zone color into the opaque paper-hi base (not a
  // translucent overlay) so the notebook lines don't show through and the
  // box stays visually consistent with the solid compose box beside it.
  const fillObj=liveMixObj(LIVE_PAPER_HI,colObj,0.12);
  const fillCol='rgb('+fillObj.r+','+fillObj.g+','+fillObj.b+')';

  const panel=document.getElementById('livePanel');
  panel.style.borderColor=col;
  panel.style.background=fillCol;
  document.getElementById('liveDot').style.background=col;

  // age label
  const diffMin=Math.round((Date.now()-_lastTimestamp)/60000);
  document.getElementById('lastUpdateTime').textContent = diffMin<60 ? 'לפני '+diffMin+' דק׳' : 'לפני '+Math.round(hours)+' שע׳';

  // lives: lose one every 2.4h until exactly 1 remains (by 9.6h) — that last
  // life PERSISTS (doesn't disappear) and stays steady gray until 12h, then
  // turns red and blinks indefinitely — "expired," not just "almost gone."
  const stage=Math.min(4,Math.floor(hours/2.4)); // 0..4 lost, caps at 4 so 1 always remains
  const remaining=5-stage;
  const expired = hours>=12;
  const lives=document.querySelectorAll('#livesRow .life');
  lives.forEach((el,i)=>{
    el.classList.remove('lit','blink');
    el.style.color='';
    if(i<remaining){
      el.classList.add('lit');
      if(remaining===1 && expired){
        el.classList.add('blink');
        el.style.color='rgb('+LIVE_RED.r+','+LIVE_RED.g+','+LIVE_RED.b+')';
      }
    }
  });
}
setInterval(renderLivePanelDecay, 60000);

window.onInput = function(){
  const val = document.getElementById('msgInput').value;
  document.getElementById('charCount').textContent = val.length + ' תווים';
  document.getElementById('submitBtn').disabled = val.trim().length < 5;
};

window.submitUpdate = async function(){
  const text = document.getElementById('msgInput').value.trim();
  if(!text) return;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.classList.add('sending');
  btn.innerHTML = '<span class="btn-spinner"></span> שולח לטייסים...';
  const sendStarted = Date.now();
  const MIN_SENDING_MS = 1100; // keep "שולח..." visible long enough to actually read it
  const STUCK_HINT_MS = 7000; // show "is this stuck?" hint if still sending after 7s
  const stuckHint = document.getElementById('stuckHint');
  const stuckTimer = setTimeout(() => stuckHint.classList.add('show'), STUCK_HINT_MS);
  try{
    const now = Date.now();
    await set(ref(db, 'tower/' + icao + '/latest'), { text, timestamp: now, icao });
    await set(ref(db, 'tower/' + icao + '/history/' + now), { text, timestamp: now, icao });
    pruneHistory(now); // fire-and-forget, doesn't block the send confirmation
    clearTimeout(stuckTimer);
    stuckHint.classList.remove('show');
    const elapsed = Date.now() - sendStarted;
    if(elapsed < MIN_SENDING_MS){
      await new Promise(r => setTimeout(r, MIN_SENDING_MS - elapsed));
    }
    document.getElementById('msgInput').value = '';
    document.getElementById('charCount').textContent = '0 תווים';
    btn.classList.remove('sending');
    btn.classList.add('sent');
    btn.innerHTML = '<span>✓</span> עודכן - מוצג לטייסים';
    loadLastUpdate();
    if(_historyLoaded) loadHistory(); // refresh the list if it was already opened
    setTimeout(() => {
      btn.classList.remove('sent');
      btn.textContent = 'שלח עדכון ›';
      btn.disabled = true;
    }, 1800);
  }catch(e){
    clearTimeout(stuckTimer);
    stuckHint.classList.remove('show');
    btn.classList.remove('sending');
    btn.textContent = 'שלח עדכון ›';
    btn.disabled = false;
    showStatus('error', 'שגיאה בשליחה. בדוק חיבור לאינטרנט.');
  }
};

// Manual escape hatch for a send that's hanging with no network response.
// Resets the button UI only — cannot cancel the original pending Firebase
// write, which may still complete later (the 2-min duplicate-flag in
// history is the safety net for that case).
window.resetStuckSend = function(){
  const btn = document.getElementById('submitBtn');
  document.getElementById('stuckHint').classList.remove('show');
  btn.classList.remove('sending');
  btn.innerHTML = 'שלח עדכון ›';
  btn.disabled = document.getElementById('msgInput').value.trim().length < 5;
};

// ---- sender-only history (not pilot-facing) ----
const HISTORY_MAX_AGE_MS = 7 * 24 * 3600000; // 7 days
const HISTORY_MAX_COUNT = 50;
const DUPLICATE_FLAG_MS = 2 * 60000; // 2 minutes

let _historyLoaded = false;
let _historyOpen = false;

window.toggleHistory = function(){
  _historyOpen = !_historyOpen;
  const panel = document.getElementById('historyPanel');
  panel.classList.toggle('open', _historyOpen);
  document.getElementById('historyChevron').classList.toggle('open', _historyOpen);
  document.getElementById('historyStateWord').textContent = _historyOpen ? 'הסתר' : 'הצג';
  if(_historyOpen && !_historyLoaded){
    loadHistory();
  }
  if(_historyOpen){
    // wait for the panel's own max-height transition to finish growing —
    // scrolling any earlier means the page doesn't have scroll room yet,
    // so the browser silently clamps the scroll short of the target.
    let done = false;
    const fire = () => { if(done) return; done = true; scrollHistoryIntoView(); };
    const onDone = (e) => {
      if(e.propertyName !== 'max-height') return;
      panel.removeEventListener('transitionend', onDone);
      fire();
    };
    panel.addEventListener('transitionend', onDone);
    setTimeout(() => { // fallback in case transitionend doesn't fire
      panel.removeEventListener('transitionend', onDone);
      fire();
    }, 350);
  }
};

// Scrolls the .body container directly so the history section sits near
// the top of the visible area. Done manually (instead of scrollIntoView)
// because scrollIntoView's automatic "nearest scrollable ancestor" search
// can be unreliable across browsers when there are nested scroll/overflow
// contexts like .card (overflow:hidden) wrapping .body (overflow-y:auto).
function scrollHistoryIntoView(){
  const bodyEl = document.querySelector('.body');
  const toggleEl = document.getElementById('historyToggle');
  const bodyRect = bodyEl.getBoundingClientRect();
  const toggleRect = toggleEl.getBoundingClientRect();
  const delta = toggleRect.top - bodyRect.top - 8;
  bodyEl.scrollBy({top: delta, behavior:'smooth'});
}

async function loadHistory(){
  const listEl = document.getElementById('historyList');
  const countEl = document.getElementById('historyCount');
  try{
    const snap = await get(ref(db, 'tower/' + icao + '/history'));
    const data = snap.val() || {};
    const entries = Object.values(data).sort((a,b) => b.timestamp - a.timestamp);
    _historyLoaded = true;
    countEl.textContent = entries.length;
    if(entries.length === 0){
      listEl.innerHTML = '<div class="history-empty">עדיין לא נשלחו עדכונים</div>';
      return;
    }
    listEl.innerHTML = entries.map((entry, i) => {
      const prev = entries[i+1]; // next-older entry (chronologically before this one)
      const flagged = prev && (entry.timestamp - prev.timestamp) < DUPLICATE_FLAG_MS;
      const d = new Date(entry.timestamp);
      const h = String(d.getUTCHours()).padStart(2,'0');
      const m = String(d.getUTCMinutes()).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      const mo = String(d.getMonth()+1).padStart(2,'0');
      const timeStr = h+':'+m+'Z · '+day+'/'+mo;
      const rel = relativeTime(entry.timestamp);
      const metaRight = flagged
        ? '<span class="flag-pill">נשלח שוב תוך 2 דק׳</span>'
        : '<span class="history-item-relative">'+escapeHtml(rel)+'</span>';
      return '<div class="history-item'+(flagged?' flagged':'')+'" onclick="this.classList.toggle(\'itemopen\')">'
        + '<div class="history-item-meta"><span class="history-item-time">'+timeStr+'</span>'+metaRight+'</div>'
        + '<div class="history-item-text">'+escapeHtml(entry.text||'')+'</div>'
        + '<div class="history-item-more">הצג עוד...</div>'
        + '</div>';
    }).join('');
  }catch(e){
    listEl.innerHTML = '<div class="history-empty">שגיאה בטעינת היסטוריה. בדוק חיבור לאינטרנט.</div>';
  }
}

function relativeTime(ts){
  const diffMin = Math.round((Date.now()-ts)/60000);
  if(diffMin < 60) return 'לפני '+diffMin+' דק׳';
  const diffHr = Math.round(diffMin/60);
  if(diffHr < 24) return 'לפני '+diffHr+' שע׳';
  return 'לפני '+Math.round(diffHr/24)+' ימים';
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Deletes entries older than HISTORY_MAX_AGE_MS, then if still over
// HISTORY_MAX_COUNT, deletes the oldest excess on top. Best-effort:
// failures here never block or alter the send confirmation flow.
async function pruneHistory(nowTs){
  try{
    const snap = await get(ref(db, 'tower/' + icao + '/history'));
    const data = snap.val() || {};
    let entries = Object.keys(data).map(key => ({ key, timestamp: data[key].timestamp }));
    const toDelete = [];
    entries.forEach(e => {
      if(nowTs - e.timestamp > HISTORY_MAX_AGE_MS) toDelete.push(e.key);
    });
    const remaining = entries.filter(e => !toDelete.includes(e.key))
      .sort((a,b) => b.timestamp - a.timestamp);
    if(remaining.length > HISTORY_MAX_COUNT){
      remaining.slice(HISTORY_MAX_COUNT).forEach(e => toDelete.push(e.key));
    }
    await Promise.all(toDelete.map(key => set(ref(db, 'tower/' + icao + '/history/' + key), null)));
  }catch(e){
    // silent — pruning is best-effort housekeeping, not user-facing
  }
}

function showStatus(type, msg){
  const el = document.getElementById('statusMsg');
  el.className = 'status ' + type + ' show';
  el.textContent = msg;
  setTimeout(() => el.classList.remove('show'), 4000);
}

init();
</script>
